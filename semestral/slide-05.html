<!DOCTYPE html>
<!-- Autoria exclusiva do código-fonte e da lógica de implementação: Caio Fábio Alves da Silva. -->
<!--
  ╔══════════════════════════════════════════════════════════════╗
  ║  SLIDE 05 — placeholder (esqueleto do Relatório Semestral)
  ║  Conteúdo real ainda não definido — só a estrutura de navegação.
  ╚══════════════════════════════════════════════════════════════╝
-->
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relatório Semestral — Slide 05 (placeholder)</title>
  <link rel="icon" type="image/png"
    href="https://prd-apex.antaq.gov.br/ords/r/sfc/120/files/static/v119/icons/app-icon-32.png" />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Open+Sans:wght@400;600&display=swap"
    rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Open Sans', sans-serif;
    }

    .slide {
      width: 100vw;
      height: 100vh;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(150deg, #071A2E 0%, #0C2D50 45%, #103C6B 100%);
      overflow: hidden;
    }

    .accent-bar {
      position: absolute;
      left: 0;
      top: 0;
      width: 6px;
      height: 100%;
      background: #0090C0;
    }

    .placeholder-badge {
      font-family: 'Montserrat', sans-serif;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: #0090C0;
      margin-bottom: 1.1rem;
    }

    .slide-num {
      font-family: 'Montserrat', sans-serif;
      font-size: 6.5rem;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.12);
      line-height: 1;
      margin-bottom: .4rem;
    }

    .slide-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 2.1rem;
      font-weight: 800;
      color: #fff;
      text-align: center;
    }

    .slide-hint {
      margin-top: .9rem;
      font-size: 1.05rem;
      color: #9fc3df;
      text-align: center;
      max-width: 44rem;
    }

    .divider {
      width: 70px;
      height: 3px;
      background: linear-gradient(90deg, #0090C0, rgba(0, 144, 192, 0));
      border-radius: 2px;
      margin: 1.4rem auto 0;
    }
  </style>
</head>

<body>
  <div class="slide">
    <div class="accent-bar"></div>
    <p class="placeholder-badge">Relatório Semestral · Esqueleto</p>
    <p class="slide-num">05</p>
    <h1 class="slide-title">Slide 05 — conteúdo a definir</h1>
    <p class="slide-hint">Estrutura de navegação já funcional (viewer, PDF e PowerPoint). O conteúdo
      deste bloco entra aqui quando o material do semestre estiver definido.</p>
    <div class="divider"></div>
  </div>

  <script>
    function goToSlide(n) {
      window.parent.postMessage({ type: "slide-goto", slide: n }, "*");
    }
    function goToFile(file) {
      window.parent.postMessage({ type: "slide-goto-file", file: file }, "*");
    }
    document.addEventListener("keydown", function (e) {
      if (["ArrowRight", "ArrowLeft", "PageDown", "PageUp", "Home", "End", " ", "f", "F"].indexOf(e.key) !== -1) {
        e.preventDefault();
        window.parent.postMessage({ type: "slide-nav", key: e.key }, "*");
      }
    });
  </script>
  <script src="a11y.js" defer></script>
</body>

</html>
