<!DOCTYPE html>

<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Demandas e tramitações por Unidade - Relatório Semestral Ouvidoria ANTAQ</title>
  <link rel="icon" type="image/png"
    href="https://prd-apex.antaq.gov.br/ords/r/sfc/120/files/static/v119/icons/app-icon-32.png" />
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&amp;family=Open+Sans:ital,wght@0,400;0,600;1,400&amp;display=swap"
    rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>

    html { font-size: clamp(14px, min(1.4583vw, 2.5926vh), 28px); }
    body { margin: 0; padding: 0; background-color: #f3f4f6; overflow: hidden; }


    .slide-container {
      width: 100vw; height: 100vh; position: relative;
      display: flex; flex-direction: column;
      background-color: #ffffff; overflow: hidden; font-family: 'Open Sans', sans-serif;
    }

    .font-montserrat { font-family: 'Montserrat', sans-serif; }
    .text-brand-primary { color: #103050; }
    .text-brand-secondary { color: #0070C0; }
    .bg-brand-secondary { background-color: #0070C0; }
    .top-accent { height: 8px; background-color: #103050; width: 100%; }
    .top-accent-secondary { height: 4px; background-color: #0070C0; width: 100%; }


    .chips {
      display: grid; grid-template-columns: repeat(5, 1fr);
      gap: .4rem .55rem; margin-top: .5rem; align-items: stretch;
    }

    .chip span { flex: 1; min-width: 0; }
    .chip b { margin-left: auto; flex-shrink: 0; }

    .chip {
      display: flex; align-items: center; gap: .4rem; width: 100%; text-align: left;
      border: 2px solid var(--c); color: var(--c); background: transparent;
      border-radius: 10px; padding: .34rem .65rem;
      font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: .6rem;
      cursor: pointer; opacity: .5; white-space: normal; line-height: 1.15;
      transition: background-color 200ms ease, color 200ms ease, opacity 200ms ease,
        box-shadow 200ms ease, transform 200ms ease;
    }
    .chip b {
      font-weight: 900; font-size: .52rem;
      background: color-mix(in srgb, var(--c) 14%, #ffffff);
      color: var(--c); border-radius: 999px; padding: .12rem .36rem; line-height: 1;
      transition: background-color 200ms ease, color 200ms ease;
    }
    .chip:hover { opacity: .85; transform: translateY(-2px); }
    .chip.active { background: var(--c); color: #ffffff; opacity: 1; box-shadow: 0 8px 18px -8px color-mix(in srgb, var(--c) 70%, transparent); }
    .chip.active b { background: rgba(255, 255, 255, .25); color: #ffffff; }


    .chips .chip-reset { width: 100%; }

    .chip-reset {
      display: inline-flex; align-items: center; justify-content: center; gap: .38rem;
      border: 2px dashed #cbd5e1; color: #64748b; background: transparent;
      border-radius: 10px; padding: .34rem .65rem;
      font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: .6rem;
      cursor: pointer; white-space: normal; line-height: 1.15; text-align: center;
      transition: background-color 200ms ease, color 200ms ease, border-color 200ms ease, transform 200ms ease;
    }
    .chip-reset:hover { color: #103050; border-color: #103050; background: #f1f5f9; transform: translateY(-2px); }

    .hint-line { margin-top: .45rem; font-size: .54rem; color: #94a3b8; font-weight: 600; display: flex; align-items: center; gap: .4rem; }
    .hint-line i { color: #0090C0; font-size: .6rem; }


    /* ---------- trilha de 2 etapas (padrao de slide-cartas-servicos) ---------- */
    .trilha {
      position: relative; display: grid; grid-template-columns: repeat(2, 1fr);
      gap: .6rem; padding: .3rem 0 .45rem; flex-shrink: 0;
      max-width: 24rem; margin: 0 auto;
    }

    /* linha cinza de base: liga as duas etapas e sugere continuidade entre elas */
    .trilha::before,
    .trilha-fill {
      content: '';
      position: absolute; top: calc(.3rem + .85rem); height: 3px; border-radius: 2px;
      left: 25%; right: 25%;
    }

    .trilha::before { background: #E2E8F0; }

    .trilha-fill {
      right: auto; width: 0;
      background: linear-gradient(90deg, #103050, #0090C0);
      transition: width .45s cubic-bezier(.4, 0, .2, 1);
    }

    .no {
      position: relative; z-index: 1; background: none; border: 0; padding: 0; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: .25rem;
      font-family: 'Montserrat', sans-serif; text-align: center;
    }

    .no-bolha {
      width: 1.7rem; height: 1.7rem; border-radius: 50%;
      background: #fff; border: 3px solid #CBD5E1; color: #94A3B8;
      font-weight: 900; font-size: .72rem;
      display: flex; align-items: center; justify-content: center;
      transition: transform .3s, background .3s, border-color .3s, color .3s, box-shadow .3s;
    }

    .no-rot {
      font-weight: 700; font-size: .56rem; line-height: 1.15; color: #94A3B8;
      transition: color .3s; max-width: 96%;
    }

    .no.feita .no-bolha { background: #103050; border-color: #103050; color: #fff; }
    .no.feita .no-rot { color: #64748B; }

    .no.ativa .no-bolha {
      background: linear-gradient(150deg, #103050, #0070C0);
      border-color: #0090C0; color: #fff; transform: scale(1.18);
      box-shadow: 0 10px 22px -8px rgba(16, 48, 80, .65);
    }

    .no.ativa .no-rot { color: #103050; font-weight: 800; }


    .painel { position: relative; }

    .etapa-foco { position: absolute; inset: 0; display: none; flex-direction: column; min-height: 0; }
    .etapa-foco.ativa { display: flex; animation: entra .38s cubic-bezier(.4, 0, .2, 1) both; }

    @keyframes entra {
      from { opacity: 0; transform: translateX(18px); }
      to { opacity: 1; transform: none; }
    }


    .empty-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: .6rem; color: #94a3b8; font-family: 'Montserrat', sans-serif; font-weight: 700;
      font-size: .8rem; padding: 2.5rem 0;
    }
    .empty-state i { font-size: 1.6rem; color: #cbd5e1; }

    .chart-card {
      background-color: #ffffff; border: 2px solid #E2E8F0; border-radius: 16px;
      box-shadow: 0 8px 20px -8px rgba(16, 48, 80, 0.18);
      padding: .8rem 1.1rem .9rem; display: flex; flex-direction: column;
      min-height: 0; min-width: 0;

      overflow: hidden;
    }

    .chart-cap {
      font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: .72rem;
      display: flex; align-items: center; gap: .45rem;
      padding-bottom: .4rem; margin-bottom: .4rem;
      border-bottom: 1px solid #eef2f7; flex-shrink: 0; transition: color 250ms ease;
    }


    .charts-grid {

      flex: 1; min-height: 0; height: 100%;
      display: grid; grid-template-columns: 1.15fr 0.85fr; grid-template-rows: minmax(0, 1fr); gap: .8rem;
    }
    .chart-canvas-wrap { flex: 1; min-height: 0; position: relative; }


    .rows { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: center; gap: .22rem; }
    .bar-row { display: flex; align-items: center; gap: .5rem; animation: fadeInRow .45s cubic-bezier(.2, .7, .3, 1) both; }

    @keyframes fadeInRow {
      from { opacity: 0; transform: translateX(-12px); }
      to { opacity: 1; transform: none; }
    }

    .bar-label {
      flex: 0 0 30%; min-width: 0;
      font-family: 'Montserrat', sans-serif; font-weight: 800; color: #103050;
      font-size: .55rem; line-height: 1.12; text-align: right;
    }
    .bar-label .pai { font-family: 'Open Sans', sans-serif; font-weight: 600; font-size: .44rem; color: #94a3b8; margin-left: .25rem; }

    .bar-track { flex: 1; min-width: 0; height: .5rem; background: #eef2f7; border-radius: 999px; overflow: hidden; }
    .bar-fill { height: 100%; width: 0; border-radius: 999px; transition: width 600ms cubic-bezier(.2, .7, .3, 1); }

    .bar-val { flex: 0 0 3.6rem; font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: .55rem; text-align: left; line-height: 1; }
    .bar-val .pc { font-weight: 700; font-size: .44rem; color: #94a3b8; margin-left: .22rem; }

    /* na etapa das demandas o valor nao leva percentual: nao ha total do qual calcular */
    .rows[data-metrica="demandas"] .bar-val { flex: 0 0 2.4rem; }


    .rows[data-density="3"] { justify-content: flex-start; }
    .rows[data-density="2"] { gap: .17rem; }
    .rows[data-density="2"] .bar-label { font-size: .5rem; }
    .rows[data-density="2"] .bar-track { height: .44rem; }
    .rows[data-density="2"] .bar-val { font-size: .5rem; }

    .rows[data-density="3"] { gap: .12rem; }
    .rows[data-density="3"] .bar-label { font-size: .44rem; }
    .rows[data-density="3"] .bar-track { height: .36rem; }
    .rows[data-density="3"] .bar-val { font-size: .45rem; }
    .rows[data-density="3"] .bar-val .pc { font-size: .38rem; }


    .zeradas {
      margin-top: .4rem; font-size: .42rem; color: #94a3b8; line-height: 1.35;
      border-left: 3px solid #e2e8f0; padding-left: .5rem; flex-shrink: 0;
    }
    .zeradas b { color: #64748b; font-weight: 700; font-family: 'Montserrat', sans-serif; }

    /* o aviso de nao-somabilidade e a mensagem central do slide: ganha destaque proprio */
    .zeradas.alerta { border-left-color: #F2A900; color: #8a6400; }
    .zeradas.alerta b { color: #7a5800; }


    /* a etapa das demandas tem um card so. Ele nao estica de ponta a ponta: com os
       rotulos a 30%, a largura cheia abriria um vao vazio a esquerda e achataria as
       barras menores, que aqui sao a maioria. */
    #etapa-1 .charts-grid { grid-template-columns: minmax(0, 1fr); }
    #etapa-1 .chart-card { max-width: 62%; margin: 0 auto; width: 100%; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
  <link rel="stylesheet" href="a11y.css">
  <link rel="stylesheet" href="base.css" />
</head>

<body>
  <div class="slide-container">
    <div class="top-accent"></div>
    <div class="top-accent-secondary"></div>

    <div class="flex items-start justify-between px-16 pt-10 pb-3 z-10">
      <div style="min-width:0;">
        <div class="flex items-center gap-3 mb-1">
          <div class="w-1 h-8 bg-brand-secondary"></div>
          <p class="text-3xl font-montserrat font-bold text-brand-primary uppercase tracking-tight">Demandas e Tramitações por Unidade</p>
        </div>
        <p class="text-gray-500 font-medium ml-4 text-base">1º semestre de 2026 · 2.362 tramitações · 20 setores com movimento</p>
      </div>

      <div class="flex items-center gap-3 opacity-80 text-brand-secondary flex-shrink-0">
        <i class="fas fa-headset text-3xl" aria-hidden="true"></i>
        <div class="flex flex-col justify-center pl-2 cap-div">
          <p class="font-montserrat font-bold text-gray-400 text-sm tracking-widest leading-none mb-1 whitespace-nowrap">CAPÍTULO 03</p>
          <p class="font-montserrat font-bold text-brand-secondary text-xs tracking-tight uppercase leading-none whitespace-nowrap">Seção de Apoio ao Cidadão — SAC</p>
        </div>
      </div>
    </div>


    <div class="px-16 pb-1 z-10">
      <div class="chips" id="chips"></div>
      <p class="hint-line" id="hintLine"></p>
    </div>

    <div class="px-16 z-10">
      <div class="trilha" role="tablist" aria-label="Etapas: demandas e tramitações">
        <div class="trilha-fill" id="trilhaFill" aria-hidden="true"></div>
        <button class="no" type="button" role="tab" data-n="1" aria-controls="etapa-1" aria-selected="false">
          <span class="no-bolha">1</span>
          <span class="no-rot">Demandas</span>
        </button>
        <button class="no" type="button" role="tab" data-n="2" aria-controls="etapa-2" aria-selected="false">
          <span class="no-bolha">2</span>
          <span class="no-rot">Tramitações</span>
        </button>
      </div>
    </div>

    <div class="flex-1 px-16 pb-2 z-10 painel" style="min-height:0;">

      <section class="etapa-foco" data-n="1" id="etapa-1" role="tabpanel" aria-label="Demandas por setor">
        <div class="charts-grid">

          <div class="chart-card">
            <p class="chart-cap" id="capDem"></p>
            <div class="rows" id="rowsDem" data-density="1" data-metrica="demandas"></div>
            <p class="zeradas alerta" id="notaDem"></p>
          </div>

        </div>
      </section>


      <section class="etapa-foco" data-n="2" id="etapa-2" role="tabpanel" aria-label="Tramitações por setor">
        <div class="charts-grid">

          <div class="chart-card">
            <p class="chart-cap" id="capTram"></p>
            <div class="rows" id="rowsTram" data-density="1" data-metrica="tramitacoes"></div>
            <p class="zeradas" id="notaTram"></p>
          </div>

          <div class="chart-card">
            <p class="chart-cap" id="pieCap"><i class="fas fa-chart-pie"></i> Distribuição por superintendência</p>
            <div class="chart-canvas-wrap" id="pieWrap"></div>
          </div>

        </div>
      </section>

    </div>

    <div class="px-16 pb-4 pt-1 flex justify-between items-center z-10">
      <p class="text-gray-400" style="font-size:.46rem;">Relatório 1º Semestre de 2026 – Ouvidoria – Agência Nacional de Transportes Aquaviários - ANTAQ</p>
    </div>
  </div>

  <script>

    /* Tramitacao e um evento por passagem: soma entre setores. 2.362 no semestre.
       Demanda e indivisivel e a mesma aparece em varios setores, entao a coluna de
       demandas NAO tem total por soma. Nao existe aqui um total de demandas do
       semestre — e por isso ele nao e exibido. */
    const BASE_T = 2362;

    // milhar em pt-BR ("2.362"), como no subtitulo do slide
    const fmt = n => n.toLocaleString('pt-BR');


    const PAIS = [
      { id: 'SOG', name: 'SOG', full: 'Superintendência de Outorgas', color: '#0090C0' },
      { id: 'SAF', name: 'SAF', full: 'Superintendência de Administração e Finanças', color: '#0EA5E9' },
      { id: 'SRG', name: 'SRG', full: 'Superintendência de Regulação', color: '#0d3358' },
      { id: 'SFC', name: 'SFC', full: 'Superintendência de Fiscalização e Coordenação das Unidades Regionais', color: '#F2A900' },
      { id: 'SESGI', name: 'SESGI', full: 'Superintendência de ESG e Inovação', color: '#5fb8dd' }
    ];

    // Participacao por setor — caminho hierarquico (superintendencia/gerencia/unidade),
    // demandas distintas que passaram pelo setor e total de tramitacoes registradas nele
    const UORGS = [
      { caminho: 'SFC/GCOR', demandas: 382, tramitacoes: 1021 },
      { caminho: 'SFC/GPF', demandas: 376, tramitacoes: 1011 },
      { caminho: 'SOG/GOA', demandas: 26, tramitacoes: 45 },
      { caminho: 'SFC/GREMN', demandas: 18, tramitacoes: 39 },
      { caminho: 'SFC/GREBL', demandas: 17, tramitacoes: 32 },
      { caminho: 'SFC/GREFL', demandas: 12, tramitacoes: 23 },
      { caminho: 'SRG/GRN', demandas: 11, tramitacoes: 30 },
      { caminho: 'SRG/GRP', demandas: 9, tramitacoes: 34 },
      { caminho: 'SESGI/GEA', demandas: 8, tramitacoes: 16 },
      { caminho: 'SAF/GGP', demandas: 7, tramitacoes: 13 },
      { caminho: 'SFC/GRERJ', demandas: 6, tramitacoes: 18 },
      { caminho: 'SOG/GAF', demandas: 6, tramitacoes: 15 },
      { caminho: 'SFC/GRERJ/UREVT', demandas: 6, tramitacoes: 12 },
      { caminho: 'SAF/GRL', demandas: 5, tramitacoes: 9 },
      { caminho: 'SESGI/GMS', demandas: 4, tramitacoes: 10 },
      { caminho: 'SFC/GREBL/URESN', demandas: 4, tramitacoes: 9 },
      { caminho: 'SFC/GREST', demandas: 4, tramitacoes: 8 },
      { caminho: 'SAF/GOF', demandas: 3, tramitacoes: 7 },
      { caminho: 'SFC/GREFL/URECB', demandas: 3, tramitacoes: 5 },
      { caminho: 'SFC/GRERE/URESV', demandas: 3, tramitacoes: 5 }
    ];

    const paiDe = id => PAIS.find(p => p.id === id);
    UORGS.forEach(u => {
      const partes = u.caminho.split('/');
      u.pai = partes[0];
      u.sigla = partes[partes.length - 1];
      u.imediato = partes.length > 2 ? partes[partes.length - 2] : null;
      u.p = paiDe(u.pai);
    });

    const TOTAL_TRAM = UORGS.reduce((s, u) => s + u.tramitacoes, 0);
    const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const selected = new Set(PAIS.map(p => p.id));

    const TOTAL_ETAPAS = 2;
    let etapa = 1;


    const chipsWrap = document.getElementById('chips');
    PAIS.forEach(p => {
      const q = UORGS.filter(u => u.pai === p.id).length;
      const b = document.createElement('button');
      b.className = 'chip';
      b.dataset.id = p.id;
      b.style.setProperty('--c', p.color);
      b.dataset.q = q;
      b.dataset.full = p.full;
      b.innerHTML = '<span>' + p.name + '</span><b>0</b>';
      b.addEventListener('click', () => toggle(p.id));
      chipsWrap.appendChild(b);
    });

    const allBtn = document.createElement('button');
    allBtn.className = 'chip-reset';
    allBtn.id = 'allBtn';
    allBtn.addEventListener('click', () => {
      if (selected.size === PAIS.length) selected.clear();
      else PAIS.forEach(p => selected.add(p.id));
      update();
    });
    chipsWrap.appendChild(allBtn);

    function toggle(id) {
      if (selected.has(id)) selected.delete(id); else selected.add(id);
      update();
    }

    /* Na etapa 1 o distintivo do chip conta SETORES, nunca demandas: somar as demandas
       de uma superintendencia repetiria a mesma demanda em cada setor dela. */
    function refreshChips() {
      chipsWrap.querySelectorAll('.chip').forEach(c => {
        const id = c.dataset.id;
        c.classList.toggle('active', selected.has(id));
        const q = +c.dataset.q;
        const n = UORGS.filter(u => u.pai === id).reduce((s, u) => s + u.tramitacoes, 0);
        const setores = q + ' setor' + (q > 1 ? 'es' : '');
        c.querySelector('b').textContent = etapa === 1 ? q : fmt(n);
        c.title = etapa === 1
          ? c.dataset.full + ' — ' + setores + ' com demandas no semestre'
          : c.dataset.full + ' — ' + setores + ' · ' + fmt(n) + ' tramitações';
      });
      document.getElementById('allBtn').innerHTML = selected.size === PAIS.length
        ? '<i class="fas fa-eraser"></i><span>Zerar tudo</span>'
        : '<i class="fas fa-layer-group"></i><span>Exibir todas</span>';
    }


    function renderBarras(metrica) {
      const campo = metrica === 'demandas' ? 'demandas' : 'tramitacoes';
      const wrap = document.getElementById(metrica === 'demandas' ? 'rowsDem' : 'rowsTram');
      const sel = UORGS.filter(u => selected.has(u.pai))
        .sort((a, b) => b[campo] - a[campo] || a.sigla.localeCompare(b.sigla, 'pt-BR'));
      wrap.innerHTML = '';

      if (!sel.length) {
        wrap.dataset.density = '1';
        wrap.innerHTML = '<div class="empty-state"><i class="far fa-hand-pointer"></i><span>' +
          'Clique numa superintendência acima para exibir seus setores</span></div>';
        return;
      }

      wrap.dataset.density = sel.length <= 12 ? '1' : sel.length <= 22 ? '2' : '3';

      const maxV = sel[0][campo];
      sel.forEach((u, i) => {
        const v = u[campo];
        const el = document.createElement('div');
        el.className = 'bar-row';
        el.style.animationDelay = (REDUCED ? 0 : i * 22) + 'ms';

        // percentual so na tramitacao: ela tem um total valido (2.362) do qual ser fracao.
        const sufixo = metrica === 'demandas'
          ? ''
          : '<span class="pc">(' + (v / BASE_T * 100).toFixed(2).replace('.', ',') + '%)</span>';

        const titulo = metrica === 'demandas'
          ? u.caminho + ' · ' + u.p.full + ' — ' + fmt(v) + ' demanda' + (v > 1 ? 's' : '') + ' que passaram por este setor'
          : u.caminho + ' · ' + u.p.full + ' — ' + fmt(v) + ' tramitações registradas neste setor';

        el.innerHTML =
          '<span class="bar-label" title="' + titulo + '">' + u.sigla +
          (u.imediato ? '<span class="pai">' + u.imediato + '</span>' : u.sigla !== u.p.name ? '<span class="pai">' + u.p.name + '</span>' : '') + '</span>' +
          '<div class="bar-track"><div class="bar-fill" style="background:' + u.p.color + '"></div></div>' +
          '<span class="bar-val" style="color:' + u.p.color + '">' + fmt(v) + sufixo + '</span>';

        wrap.appendChild(el);
        const fill = el.querySelector('.bar-fill');
        const w = (v / maxV * 100) + '%';
        if (REDUCED) fill.style.width = w;
        else requestAnimationFrame(() => requestAnimationFrame(() => { fill.style.width = w; }));
      });
    }


    function refreshLegendas() {
      const sel = UORGS.filter(u => selected.has(u.pai));
      const capD = document.getElementById('capDem');
      const capT = document.getElementById('capTram');
      const notaD = document.getElementById('notaDem');
      const notaT = document.getElementById('notaTram');

      if (!sel.length) {
        capD.style.color = '#94a3b8';
        capT.style.color = '#94a3b8';
        capD.innerHTML = '<i class="far fa-hand-pointer"></i> Nada a exibir';
        capT.innerHTML = '<i class="far fa-hand-pointer"></i> Nada a exibir';
        notaD.innerHTML = '';
        notaT.innerHTML = '';
        return;
      }

      const somaT = sel.reduce((s, u) => s + u.tramitacoes, 0);
      const setores = sel.length + ' setor' + (sel.length > 1 ? 'es' : '');

      capD.style.color = '#475569';
      capD.innerHTML = '<i class="fas fa-list-ol"></i> Demandas por setor · ' + setores +
        ' <span style="font-weight:700;color:#8a6400;">(sem total: não se somam)</span>';

      capT.style.color = '#475569';
      capT.innerHTML = '<i class="fas fa-ranking-star"></i> ' + setores +
        ' · ' + fmt(somaT) + ' de ' + fmt(TOTAL_TRAM) + ' <span style="font-weight:700;color:#0070C0;">tramitações</span>';

      notaD.innerHTML = 'Cada barra conta as demandas <b>que passaram por aquele setor</b>. A mesma demanda ' +
        'aparece em mais de uma barra, então elas <b>não somam</b> — não há um total de demandas nesta etapa.';

      notaT.innerHTML = 'Cada passagem de uma demanda por um setor é <b>uma tramitação</b>, registrada de forma ' +
        'independente. Por isso as barras somam: <b>' + fmt(TOTAL_TRAM) + '</b> tramitações no semestre.';
    }


    let pieChart = null;
    function renderRosca() {
      const wrap = document.getElementById('pieWrap');
      const cap = document.getElementById('pieCap');
      if (pieChart) { pieChart.destroy(); pieChart = null; }

      const porPai = PAIS
        .map(p => ({ p, v: UORGS.filter(u => u.pai === p.id && selected.has(u.pai)).reduce((s, u) => s + u.tramitacoes, 0) }))
        .filter(x => x.v > 0);
      const somaExibida = porPai.reduce((s, x) => s + x.v, 0);

      if (!somaExibida) {
        wrap.innerHTML = '<div class="empty-state"><i class="fas fa-chart-pie"></i>' +
          '<span>Selecione ao menos uma superintendência</span></div>';
        cap.style.color = '#94a3b8';
        cap.innerHTML = '<i class="fas fa-chart-pie"></i> Distribuição por superintendência';
        return;
      }

      wrap.innerHTML = '<canvas id="pieChart" role="img"></canvas>';
      document.getElementById('pieChart').setAttribute('aria-label', 'Gráfico de rosca: distribuição das tramitações por superintendência — ' +
        porPai.map(x => x.p.name + ' ' + x.v).join(', '));

      const percentageLabelsPlugin = {
        id: 'percentageLabels',
        afterDraw(chart) {
          const { ctx } = chart;
          const ds = chart.data.datasets[0];
          const total = ds.data.reduce((s, v) => s + v, 0) || 1;
          ctx.save();
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          chart.getDatasetMeta(0).data.forEach((arc, i) => {
            const pct = ds.data[i] / total * 100;
            if (pct < 4) return;
            const ang = (arc.startAngle + arc.endAngle) / 2;
            const r = (arc.outerRadius + arc.innerRadius) / 2;
            const x = arc.x + Math.cos(ang) * r;
            const y = arc.y + Math.sin(ang) * r;
            ctx.font = '700 ' + (pct >= 15 ? 14 : 11) + 'px Montserrat, sans-serif';
            ctx.strokeStyle = 'rgba(16,48,80,.35)';
            ctx.lineWidth = 3;
            ctx.strokeText(pct.toFixed(1).replace('.', ',') + '%', x, y);
            ctx.fillStyle = '#ffffff';
            ctx.fillText(pct.toFixed(1).replace('.', ',') + '%', x, y);
          });
          ctx.restore();
        }
      };

      pieChart = new Chart(document.getElementById('pieChart'), {
        type: 'doughnut',
        data: {
          labels: porPai.map(x => x.p.name),
          datasets: [{
            data: porPai.map(x => x.v),
            backgroundColor: porPai.map(x => x.p.color),
            borderColor: '#ffffff',
            borderWidth: 3,
            hoverOffset: 8
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '58%',
          animation: { duration: REDUCED ? 0 : 650 },
          plugins: {
            legend: { position: 'bottom', labels: { color: '#103050', boxWidth: 12, boxHeight: 12, padding: 10, font: { family: 'Open Sans', size: 11, weight: '600' } } },
            tooltip: {
              callbacks: {
                label: c => c.label + ': ' + fmt(c.parsed) + ' tramitações (' +
                  (c.parsed / somaExibida * 100).toFixed(1).replace('.', ',') + '%)'
              }
            }
          }
        },
        plugins: [percentageLabelsPlugin]
      });

      if (window.A11y) {
        A11y.renderChartFallbackTable(
          document.getElementById('pieChart'),
          'Distribuição das tramitações por superintendência',
          ['Superintendência', 'Tramitações'],
          porPai.map(x => [x.p.name, String(x.v)])
        );
      }

      cap.style.color = '#475569';
      cap.innerHTML = '<i class="fas fa-chart-pie"></i> Distribuição por superintendência · ' +
        '<span style="font-weight:700;color:#0070C0;">% de ' + fmt(somaExibida) + ' tramitações</span>';
    }


    /* ---------- trilha de etapas ---------- */
    const nos = Array.from(document.querySelectorAll('.no'));
    const focos = Array.from(document.querySelectorAll('.etapa-foco'));
    const fill = document.getElementById('trilhaFill');

    function irPara(n) {
      etapa = Math.max(1, Math.min(TOTAL_ETAPAS, n));
      nos.forEach(no => {
        const i = +no.dataset.n;
        no.classList.toggle('ativa', i === etapa);
        no.classList.toggle('feita', i < etapa);
        no.setAttribute('aria-selected', i === etapa ? 'true' : 'false');
      });
      focos.forEach(f => f.classList.toggle('ativa', +f.dataset.n === etapa));
      fill.style.width = ((etapa - 1) / (TOTAL_ETAPAS - 1) * 50) + '%';
      refreshChips();
      refreshHint();
      if (etapa === 2) renderRosca();
    }

    nos.forEach(no => no.addEventListener('click', () => irPara(+no.dataset.n)));

    function refreshHint() {
      document.getElementById('hintLine').innerHTML = etapa === 1
        ? '<i class="far fa-hand-pointer"></i><span>Filtre por superintendência · barras em <b style="color:#64748b;">demandas</b>, contadas por setor e <b style="color:#8a6400;">não somáveis</b></span>'
        : '<i class="far fa-hand-pointer"></i><span>Filtre por superintendência · barras em <b style="color:#64748b;">tramitações</b>, com o percentual sobre as ' + fmt(BASE_T) + ' do semestre</span>';
    }


    function update() {
      refreshChips();
      refreshLegendas();
      renderBarras('demandas');
      renderBarras('tramitacoes');
      if (etapa === 2) renderRosca();
      refreshHint();
    }

    update();
    irPara(1);


    document.addEventListener('DOMContentLoaded', function () {
      if (window.A11y && etapa === 2) renderRosca();
    });
  </script>
  <script>document.addEventListener("keydown", function (e) { if (["ArrowRight", "ArrowLeft", "PageDown", "PageUp", "Home", "End", " ", "f", "F"].indexOf(e.key) !== -1) { e.preventDefault(); window.parent.postMessage({ type: "slide-nav", key: e.key }, "*"); } });</script>
  <script src="a11y.js" defer></script>
  <script src="vida.js" defer></script>
</body>
