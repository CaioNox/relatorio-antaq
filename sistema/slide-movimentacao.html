<!DOCTYPE html>
<!-- Autoria exclusiva do código-fonte e da lógica de implementação: Caio Fábio Alves da Silva. -->
<!--
  ╔══════════════════════════════════════════════════════════════╗
  ║  SLIDE — Movimentação / tratamento de demandas — 1º tri/2026
  ╠══════════════════════════════════════════════════════════════╣
  ║  São quatro números sobre uma base de 371. Número pequeno pede
  ║  painel de indicadores, não gráfico — o gráfico aqui seria
  ║  enfeite. Layout LADO A LADO: indicadores (2×2) à esquerda e a
  ║  série mensal à direita, que é a única leitura que um gráfico
  ║  acrescenta aqui. Cabe inteiro na tela, sem rolagem.
  ║
  ║  ⚠ "TOTAL DE ENCAMINHAMENTOS" É DERIVADO: vale ENCAMINHAMENTOS
  ║  DA OUVIDORIA + ENCAMINHAMENTOS (9 + 0 = 9). Não é uma quarta
  ║  categoria — por isso o cartão
  ║  dele tem estilo diferente e fica fora da série mensal, senão
  ║  a mesma demanda seria contada duas vezes.
  ║
  ║  ⚠ A BASE AQUI É 371 (demandas REGISTRADAS no 1º tri/26, "A").
  ║  Não confundir com a base 353 do slide-tramit-uorg.html nem com
  ║  as 130 respostas do slide-resp-unidade.html — são universos
  ║  diferentes e os percentuais NÃO são comparáveis entre slides.
  ║
  ║  O QUE ATUALIZAR A CADA TRIMESTRE:
  ║  const BASE_A e os valores [jan, fev, mar] em METRICAS[].
  ╚══════════════════════════════════════════════════════════════╝
-->

<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Movimentação e tratamento de demandas - Relatório Trimestral Ouvidoria ANTAQ</title>
  <link rel="icon" type="image/png"
    href="https://prd-apex.antaq.gov.br/ords/r/sfc/120/files/static/v119/icons/app-icon-32.png" />
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&amp;family=Open+Sans:ital,wght@0,400;0,600;1,400&amp;display=swap"
    rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    html { font-size: clamp(13px, min(1.354vw, 2.407vh), 26px); }
    body { margin: 0; padding: 0; background-color: #f3f4f6; overflow: hidden; }

    .slide-container {
      width: 100vw; height: 100vh; position: relative;
      display: flex; flex-direction: column;
      background-color: #ffffff; overflow: hidden; font-family: 'Open Sans', sans-serif;
    }

    .font-montserrat { font-family: 'Montserrat', sans-serif; }
    .text-brand-primary { color: #103050; }
    .text-brand-secondary { color: #0070C0; }
    .bg-brand-secondary { background-color: #0070C0; }
    .top-accent { height: 8px; background-color: #103050; width: 100%; }
    .top-accent-secondary { height: 4px; background-color: #0070C0; width: 100%; }

    /* lado a lado: painel de indicadores à esquerda, série mensal à direita */
    .body-grid {
      flex: 1; min-height: 0; z-index: 10;
      display: grid; grid-template-columns: 1fr 1fr;
      gap: .9rem; padding: .6rem 4rem .8rem;
    }

    /* ===================== PAINEL DE INDICADORES ===================== */
    .kpis {
      display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
      gap: .8rem; min-height: 0;
    }

    .kpi {
      border-radius: 16px; padding: .9rem 1rem; position: relative; overflow: hidden;
      display: flex; flex-direction: column; justify-content: space-between;
      min-height: 0;
      box-shadow: 0 14px 32px -14px rgba(16, 48, 80, .45);
      animation: fadeIn .5s ease both;
    }
    .kpi:nth-child(2) { animation-delay: .08s; }
    .kpi:nth-child(3) { animation-delay: .16s; }
    .kpi:nth-child(4) { animation-delay: .24s; }

    .kpi-lab {
      font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: .58rem;
      letter-spacing: .09em; text-transform: uppercase; margin-bottom: .35rem;
      display: flex; align-items: center; gap: .4rem;
    }
    .kpi-num { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 3rem; line-height: 1; }
    .kpi-pct { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: .82rem; margin-top: .2rem; }
    .kpi-sub { font-size: .58rem; line-height: 1.35; margin-top: .5rem; }
    .kpi-wm { position: absolute; right: -12px; bottom: -18px; font-size: 5.2rem; opacity: .1; }

    /* cartão de categoria (cheio) */
    .kpi.solid { color: #fff; }
    .kpi.solid .kpi-lab { color: rgba(255, 255, 255, .82); }
    .kpi.solid .kpi-num, .kpi.solid .kpi-pct { color: #fff; }
    .kpi.solid .kpi-sub { color: rgba(255, 255, 255, .88); }

    /* cartão zerado — sem cor cheia, para não dar peso visual a um zero */
    .kpi.zero { background: #F7F9FC; border: 2px solid #E5E9F0; box-shadow: none; }
    .kpi.zero .kpi-lab { color: #94a3b8; }
    .kpi.zero .kpi-num, .kpi.zero .kpi-pct { color: #cbd5e1; }
    .kpi.zero .kpi-sub { color: #94a3b8; }
    .kpi.zero .kpi-wm { color: #cbd5e1; }

    /* ▼ cartão DERIVADO: é a soma dos dois primeiros, não uma categoria nova */
    .kpi.derived {
      background: #ffffff; border: 2px dashed #cbd5e1; box-shadow: none;
    }
    /* espaço reservado à direita para o selo "soma" não cobrir o rótulo */
    .kpi.derived .kpi-lab { color: #64748b; padding-right: 3.4rem; }
    .kpi.derived .kpi-num, .kpi.derived .kpi-pct { color: #103050; }
    .kpi.derived .kpi-sub { color: #64748b; }
    .kpi.derived .kpi-wm { color: #e2e8f0; }
    .derived-tag {
      position: absolute; top: .7rem; right: .9rem;
      font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: .46rem;
      letter-spacing: .08em; text-transform: uppercase;
      color: #64748b; background: #f1f5f9; border-radius: 999px; padding: .16rem .45rem;
    }

    /* ===================== SÉRIE MENSAL ===================== */
    .chart-card {
      background-color: #ffffff; border: 2px solid #E2E8F0; border-radius: 16px;
      box-shadow: 0 8px 20px -8px rgba(16, 48, 80, .18);
      padding: .9rem 1.3rem 1rem; display: flex; flex-direction: column; min-height: 0;
    }
    .chart-cap {
      font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: .78rem; color: #475569;
      display: flex; align-items: center; gap: .5rem;
      padding-bottom: .45rem; margin-bottom: .45rem; border-bottom: 1px solid #eef2f7; flex-shrink: 0;
    }
    .chart-wrap { flex: 1; min-height: 0; position: relative; }

    .nota {
      font-size: .5rem; color: #94a3b8; line-height: 1.4; margin-top: .5rem;
      border-left: 3px solid #e2e8f0; padding-left: .55rem;
    }
    .nota b { color: #64748b; font-weight: 700; font-family: 'Montserrat', sans-serif; }

    /* ===== filtro por mês ===== */
    .chips-mes { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem; margin-top: .5rem; }
    .mes-lab {
      font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: .5rem;
      letter-spacing: .1em; text-transform: uppercase; color: #94a3b8; margin-right: .2rem;
    }
    .chip-mes {
      display: inline-flex; align-items: center; gap: .35rem;
      border: 2px solid #103050; color: #103050; background: transparent;
      border-radius: 8px; padding: .26rem .62rem;
      font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: .55rem;
      cursor: pointer; opacity: .45; white-space: nowrap; line-height: 1;
      transition: background-color 180ms ease, color 180ms ease, opacity 180ms ease, transform 180ms ease;
    }
    .chip-mes b {
      font-weight: 900; font-size: .48rem; background: #eef2f7; color: #103050;
      border-radius: 5px; padding: .1rem .3rem; line-height: 1;
      transition: background-color 180ms ease, color 180ms ease;
    }
    .chip-mes:hover { opacity: .8; transform: translateY(-1px); }
    .chip-mes.active { background: #103050; color: #fff; opacity: 1; }
    .chip-mes.active b { background: rgba(255, 255, 255, .22); color: #fff; }

    .chip-reset {
      display: inline-flex; align-items: center; gap: .35rem;
      border: 2px dashed #cbd5e1; color: #64748b; background: transparent;
      border-radius: 999px; padding: .26rem .62rem;
      font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: .55rem;
      cursor: pointer; white-space: nowrap; line-height: 1;
      transition: background-color 180ms ease, color 180ms ease, border-color 180ms ease, transform 180ms ease;
    }
    .chip-reset:hover { color: #103050; border-color: #103050; background: #f1f5f9; transform: translateY(-1px); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>

<body>
  <div class="slide-container">
    <div class="top-accent"></div>
    <div class="top-accent-secondary"></div>

    <div class="flex items-start justify-between px-16 pt-8 pb-2 z-10">
      <div>
        <div class="flex items-center gap-3 mb-1">
          <div class="w-1 h-8 bg-brand-secondary"></div>
          <p class="text-3xl font-montserrat font-bold text-brand-primary uppercase tracking-tight">Movimentação e Tratamento</p>
        </div>
        <p class="text-gray-500 font-medium ml-4" style="font-size:.72rem;">1º trimestre de 2026 · percentuais sobre 371 demandas registradas</p>
        <div class="chips-mes ml-4" id="chipsMes"></div>
      </div>
      <div class="flex items-center gap-3 opacity-80 text-brand-secondary flex-shrink-0">
        <i class="fas fa-lock-open text-3xl" aria-hidden="true"></i>
        <div class="flex flex-col justify-center pl-2" style="border-left:1px solid #CBD5E1;">
          <p class="font-montserrat font-bold text-gray-400 text-sm tracking-widest leading-none mb-1 whitespace-nowrap">CAPÍTULO 04</p>
          <p class="font-montserrat font-bold text-brand-secondary text-xs tracking-tight uppercase leading-none whitespace-nowrap">Seção de Transparência e Acesso à Informação - STAI</p>
        </div>
      </div>
    </div>

    <div class="body-grid">
      <div class="kpis" id="kpis"></div>

      <div class="chart-card">
        <p class="chart-cap" id="serieCap"><i class="fas fa-chart-column"></i> Evolução mensal</p>
        <div class="chart-wrap"><canvas id="serie"></canvas></div>
        <p class="nota" id="nota"></p>
      </div>
    </div>

    <div class="px-16 pb-6 pt-1 flex justify-between items-center z-10">
      <p class="text-gray-400 text-xs">Relatório 1º Trimestre de 2026 – Ouvidoria – Agência Nacional de Transportes Aquaviários - ANTAQ</p>
    </div>
  </div>

  <script>
    /* =========================================================
       DADOS — movimentação/tratamento, 1º tri/2026
       BASE_A = demandas registradas no trimestre (denominador do %)
       ========================================================= */
    const BASE_A = 371;
    const MESES = ['Janeiro', 'Fevereiro', 'Março'];

    const METRICAS = [
      { id: 'ouvenc', lab: 'Encaminhamentos da Ouvidoria', icon: 'fa-share-from-square', color: '#0070C0', m: [0, 4, 5], tipo: 'cat', sub: 'Encaminhamentos feitos pela Ouvidoria' },
      { id: 'enc', lab: 'Encaminhamentos', icon: 'fa-share-nodes', color: '#94a3b8', m: [0, 0, 0], tipo: 'cat', sub: 'Sem registro no trimestre' },
      { id: 'totenc', lab: 'Total de Encaminhamentos', icon: 'fa-sigma', color: '#103050', m: [0, 4, 5], tipo: 'derivado', sub: 'Soma dos dois cartões anteriores' },
      { id: 'ouvai', lab: 'Acesso à Informação', icon: 'fa-unlock-keyhole', color: '#F2A900', m: [6, 15, 37], tipo: 'cat', sub: 'Acesso à informação tratado pela Ouvidoria' }
    ];

    METRICAS.forEach(k => k.total = k.m.reduce((a, b) => a + b, 0));
    const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const selMeses = new Set(MESES.map((_, i) => i));
    const mesesSel = () => MESES.map((_, i) => i).filter(i => selMeses.has(i));
    /* total da métrica considerando só os meses selecionados */
    const totalDe = k => k.m.reduce((s, v, i) => s + (selMeses.has(i) ? v : 0), 0);
    let serieChart = null;

    /* ===================== CHIPS — por mês ===================== */
    const chipsMesWrap = document.getElementById('chipsMes');
    const lab = document.createElement('span');
    lab.className = 'mes-lab';
    lab.textContent = 'Mês';
    chipsMesWrap.appendChild(lab);

    MESES.forEach((nome, i) => {
      const b = document.createElement('button');
      b.className = 'chip-mes';
      b.dataset.mes = i;
      b.innerHTML = '<span>' + nome + '</span><b>0</b>';
      b.addEventListener('click', () => {
        if (selMeses.has(i)) selMeses.delete(i); else selMeses.add(i);
        update();
      });
      chipsMesWrap.appendChild(b);
    });

    const allMesBtn = document.createElement('button');
    allMesBtn.className = 'chip-reset';
    allMesBtn.id = 'allMesBtn';
    allMesBtn.addEventListener('click', () => {
      if (selMeses.size === MESES.length) selMeses.clear();
      else MESES.forEach((_, i) => selMeses.add(i));
      update();
    });
    chipsMesWrap.appendChild(allMesBtn);

    function refreshChipsMes() {
      chipsMesWrap.querySelectorAll('.chip-mes').forEach(c => {
        const i = +c.dataset.mes;
        c.classList.toggle('active', selMeses.has(i));
        // badge = total do mês somando só as métricas de categoria (sem a derivada)
        c.querySelector('b').textContent =
          METRICAS.filter(k => k.tipo === 'cat').reduce((s, k) => s + k.m[i], 0);
      });
      document.getElementById('allMesBtn').innerHTML = selMeses.size === MESES.length
        ? '<i class="fas fa-eraser"></i><span>Nenhum</span>'
        : '<i class="fas fa-calendar-days"></i><span>Todos os meses</span>';
    }

    /* ===================== PAINEL DE INDICADORES ===================== */
    const wrap = document.getElementById('kpis');

    function renderKpis() {
      wrap.innerHTML = '';
      METRICAS.forEach(k => {
        const v = totalDe(k);
        const pct = (v / BASE_A * 100).toFixed(2).replace('.', ',') + '%';
        const div = document.createElement('div');
        const zerado = v === 0;
        div.className = 'kpi ' + (k.tipo === 'derivado' ? 'derived' : zerado ? 'zero' : 'solid');
        if (k.tipo !== 'derivado' && !zerado) {
          div.style.background = 'linear-gradient(160deg, ' + k.color + ' 0%, ' +
            (k.id === 'ouvai' ? '#103050' : '#103050') + ' 100%)';
        }
        div.innerHTML =
          (k.tipo === 'derivado' ? '<span class="derived-tag">soma</span>' : '') +
          '<div>' +
          '<p class="kpi-lab"><i class="fas ' + k.icon + '"></i>' + k.lab + '</p>' +
          '<p class="kpi-num">' + v + '</p>' +
          '<p class="kpi-pct">' + pct + ' de ' + BASE_A + '</p>' +
          '</div>' +
          '<p class="kpi-sub">' + k.sub + '</p>' +
          '<i class="fas ' + k.icon + ' kpi-wm"></i>';
        wrap.appendChild(div);
      });
    }

    /* ===================== SÉRIE MENSAL =====================
       Só as métricas de categoria — a derivada ficaria contando
       duas vezes a mesma demanda dentro do mesmo eixo. */
    function renderSerie() {
      if (serieChart) serieChart.destroy();
      const ms = mesesSel();
      const series = METRICAS.filter(k => k.tipo === 'cat' && k.total > 0);

      serieChart = new Chart(document.getElementById('serie'), {
      type: 'bar',
      data: {
        labels: ms.map(i => MESES[i]),
        datasets: series.map(k => ({
          label: k.lab,
          data: ms.map(i => k.m[i]),
          backgroundColor: k.color,
          borderRadius: 4,
          borderSkipped: false,
          maxBarThickness: 54
        }))
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: REDUCED ? 0 : 650 },
        scales: {
          x: { grid: { display: false }, ticks: { color: '#475569', font: { family: 'Open Sans', size: 12, weight: '600' } } },
          y: { beginAtZero: true, grid: { color: '#eef2f7' }, ticks: { color: '#94a3b8', font: { family: 'Open Sans', size: 11 }, precision: 0 } }
        },
        plugins: {
          legend: { position: 'bottom', labels: { color: '#103050', boxWidth: 12, boxHeight: 12, padding: 12, font: { family: 'Open Sans', size: 11, weight: '600' } } },
          tooltip: { callbacks: { label: c => c.dataset.label + ': ' + c.parsed.y } }
        }
      },
      plugins: [{
        id: 'valueLabels',
        afterDatasetsDraw(chart) {
          const { ctx } = chart;
          ctx.save();
          ctx.textAlign = 'center';
          ctx.textBaseline = 'bottom';
          ctx.font = '800 12px Montserrat, sans-serif';
          chart.data.datasets.forEach((ds, di) => {
            chart.getDatasetMeta(di).data.forEach((bar, i) => {
              const v = ds.data[i];
              if (!v) return;
              ctx.fillStyle = ds.backgroundColor;
              ctx.fillText(v, bar.x, bar.y - 4);
            });
          });
          ctx.restore();
        }
      }]
      });

      const cresc = METRICAS.find(k => k.id === 'ouvai');
      const cap = document.getElementById('serieCap');
      if (!ms.length) {
        cap.innerHTML = '<i class="fas fa-chart-column"></i> Nenhum mês selecionado';
      } else if (ms.length === MESES.length) {
        cap.innerHTML = '<i class="fas fa-chart-column"></i> Evolução mensal · Acesso à Informação passou de ' +
          cresc.m[0] + ' em janeiro para ' + cresc.m[2] + ' em março';
      } else {
        cap.innerHTML = '<i class="fas fa-chart-column"></i> ' + ms.map(i => MESES[i]).join(' + ') +
          ' · Acesso à Informação ' + ms.reduce((s, i) => s + cresc.m[i], 0);
      }
    }

    function renderNota() {
      const parcial = selMeses.size < MESES.length;
      document.getElementById('nota').innerHTML =
        '<b>Base:</b> os percentuais são sobre as ' + BASE_A + ' demandas registradas no 1º trimestre de 2026 (A)' +
        (parcial ? ' — <b>o denominador continua sendo o trimestre inteiro</b>, mesmo com o filtro de mês, ' +
          'porque a planilha não informa quantas demandas foram registradas em cada mês. ' : '. ') +
        '<b>Total de Encaminhamentos</b> é a soma dos Encaminhamentos da Ouvidoria com os Encaminhamentos, por isso não aparece no gráfico — contaria a mesma demanda duas vezes.';
    }

    function update() {
      refreshChipsMes();
      renderKpis();
      renderSerie();
      renderNota();
    }

    update();
  </script>
  <script>document.addEventListener("keydown", function (e) { if (["ArrowRight", "ArrowLeft", "PageDown", "PageUp", "Home", "End", " ", "f", "F"].indexOf(e.key) !== -1) { e.preventDefault(); window.parent.postMessage({ type: "slide-nav", key: e.key }, "*"); } });</script>
</body>

</html>
