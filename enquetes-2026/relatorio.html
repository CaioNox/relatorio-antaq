<!DOCTYPE html>
<!-- Autoria exclusiva do código-fonte e da lógica de implementação: Caio Fábio Alves da Silva. -->
<!--
  ╔══════════════════════════════════════════════════════════════════════════╗
  ║  enquetes-2026/relatorio.html — VERSÃO PARA IMPRESSÃO / PDF               ║
  ╠══════════════════════════════════════════════════════════════════════════╣
  ║  NENHUM SLIDE É ALTERADO POR ESTE ARQUIVO. Ele apenas monta os slides     ║
  ║  existentes em páginas 16:9 paisagem.                                     ║
  ║                                                                           ║
  ║  LEVEZA (o que mudou em relação à versão anterior):                       ║
  ║   • Os ~94 iframes não são criados de uma vez. Cada página só monta       ║
  ║     o slide quando chega perto da tela (IntersectionObserver) e é         ║
  ║     desmontada quando fica longe — navegar fica leve.                     ║
  ║   • Para imprimir, use o botão "Preparar impressão": ele monta tudo em    ║
  ║     lotes, espera carregar (com barra de progresso) e só então chama o    ║
  ║     print. Isso evita páginas em branco por iframe não carregado.         ║
  ║                                                                           ║
  ║  ANEXOS: o conteúdo que no slide só aparece ao clicar (glossário,         ║
  ║  decretos, leis, normativos, carta de serviços, bases de dados abertos)   ║
  ║  é lido dos próprios arquivos e vira páginas de texto, logo após o slide  ║
  ║  correspondente. São páginas leves (sem iframe).                          ║
  ║                                                                           ║
  ║  Para gerar o PDF sem bordas:                                             ║
  ║   • Ctrl+P → Destino "Salvar como PDF" • Layout Paisagem                  ║
  ║   • Margens: Nenhuma • marque "Gráficos de segundo plano"                 ║
  ╚══════════════════════════════════════════════════════════════════════════╝
-->
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relatório Anual de Enquetes — versão para impressão · Ouvidoria ANTAQ</title>
  <link rel="icon" type="image/png"
    href="https://prd-apex.antaq.gov.br/ords/r/sfc/120/files/static/v119/icons/app-icon-32.png" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Open+Sans:wght@400;600&display=swap"
    rel="stylesheet" />
  <!-- Usadas só pelo botão "Baixar PowerPoint": tiram um print de cada slide
       e montam um .pptx no navegador, sem servidor. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
  <link rel="stylesheet" href="a11y.css" />
  <style>
    /* Página física = 16:9 landscape → o slide preenche 100% sem bordas */
    :root {
      --page-w: 297mm;
      --page-h: 167mm;
      --scale: 0.584646;
      /* escala do canvas 1920×1080 para 297mm */
    }

    @page {
      size: 297mm 167mm;
      margin: 0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #4b5563;
      font-family: 'Open Sans', 'Segoe UI', sans-serif;
    }

    /* ───────────────────────── Barra de ações (só na tela) ──────────────── */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 1.25rem;
      flex-wrap: wrap;
      padding: 14px 22px;
      background: #0f172a;
      color: #e5e7eb;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .3);
    }

    .toolbar h1 {
      font-size: 15px;
      font-weight: 700;
      margin: 0;
      letter-spacing: .02em;
    }

    .toolbar .hint {
      font-size: 12.5px;
      color: #94a3b8;
      line-height: 1.4;
      margin: 4px 0 0;
    }

    .toolbar .hint b {
      color: #cbd5e1;
    }

    .toolbar-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: .6rem;
    }

    .btn-print, .btn-pptx {
      border: 0;
      cursor: pointer;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      padding: 10px 18px;
      border-radius: 8px;
      transition: background .2s;
    }

    .btn-print { background: #0090C0; }
    .btn-print:hover { background: #0070C0; }
    .btn-print[disabled] { background: #475569; cursor: progress; }

    .btn-pptx { background: #F2A900; color: #103050; }
    .btn-pptx:hover { background: #d99400; }
    .btn-pptx[disabled] { background: #475569; color: #fff; cursor: progress; }

    .prog {
      width: 190px;
      height: 6px;
      border-radius: 3px;
      background: #1e293b;
      overflow: hidden;
      display: none;
    }

    .prog.on {
      display: block;
    }

    .prog i {
      display: block;
      height: 100%;
      width: 0;
      background: #0090C0;
      transition: width .2s;
    }

    /* ───────────────────────────── Folhas ───────────────────────────────── */
    .sheets {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 22px 0 40px;
    }

    .page {
      width: var(--page-w);
      height: var(--page-h);
      position: relative;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }

    /* Cada slide roda no tamanho de projeto (1920×1080) e é reduzido por
       transform para preencher exatamente a página. */
    .page iframe {
      width: 1920px;
      height: 1080px;
      border: 0;
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: top left;
      transform: scale(var(--scale));
      background: #fff;
    }

    /* Marcador exibido enquanto o slide não está montado (só na tela) */
    .ph {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #94a3b8;
      font-size: 13px;
      background: repeating-linear-gradient(45deg, #fafbfc, #fafbfc 12px, #f3f5f8 12px, #f3f5f8 24px);
    }

    .ph b {
      color: #64748b;
      font-family: 'Montserrat', sans-serif;
      font-size: 15px;
    }

    /* ──────────────────────────── Páginas de anexo ──────────────────────── */
    .annex {
      padding: 11mm 13mm 9mm;
      display: flex;
      flex-direction: column;
      font-family: 'Open Sans', sans-serif;
    }

    .annex-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
      border-bottom: 2px solid #103050;
      padding-bottom: 5px;
      margin-bottom: 7px;
      flex-shrink: 0;
    }

    .annex-kicker {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 8pt;
      letter-spacing: .18em;
      color: #0090C0;
      text-transform: uppercase;
    }

    .annex-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 13pt;
      color: #103050;
      margin: 0;
    }

    .annex-cont {
      margin-left: auto;
      font-size: 8pt;
      color: #94a3b8;
    }

    .annex-grid {
      display: flex;
      gap: 8mm;
      flex: 1;
      min-height: 0;
    }

    .annex-col {
      flex: 1 1 0;
      min-width: 0;
      overflow: hidden;
    }

    .annex-item {
      margin-bottom: 3.4mm;
    }

    .ai-src {
      font-size: 7pt;
      color: #94a3b8;
      margin: 1px 0 0;
      word-break: break-all;
    }

    .ai-top {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .ai-num {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 7.5pt;
      color: #fff;
      background: #103050;
      border-radius: 4px;
      padding: 1px 5px;
      flex-shrink: 0;
    }

    .ai-name {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 9.5pt;
      color: #103050;
      line-height: 1.18;
    }

    .ai-tag {
      font-size: 7.5pt;
      color: #0070C0;
      font-weight: 600;
      margin: 1px 0 0;
    }

    .ai-desc {
      font-size: 8pt;
      line-height: 1.36;
      color: #37475a;
      margin: 2px 0 0;
      text-align: justify;
    }

    .annex-foot {
      flex-shrink: 0;
      border-top: 1px solid #e2e8f0;
      padding-top: 4px;
      margin-top: 5px;
      font-size: 7pt;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
    }

    /* ───────────────────────────── Impressão ────────────────────────────── */
    @media print {

      html,
      body {
        background: #fff;
      }

      .toolbar {
        display: none !important;
      }

      .sheets {
        gap: 0;
        padding: 0;
      }

      .page {
        box-shadow: none;
        break-after: page;
        page-break-after: always;
      }

      .page:last-child {
        break-after: auto;
        page-break-after: auto;
      }

      .ph {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="toolbar">
    <div>
      <h1>Relatório Anual de Enquetes do Conselho de Usuários · 2026 — versão para impressão</h1>
      <p class="hint">
        Clique em <b>Preparar impressão</b> (carrega todos os slides antes de imprimir). Depois:
        <b>Layout Paisagem</b> · <b>Margens: Nenhuma</b> · marque <b>Gráficos de segundo plano</b>.
      </p>
    </div>
    <div class="prog" id="prog"><i></i></div>
    <div class="toolbar-actions">
      <button class="btn-pptx" id="btnPptx"
        title="Cada slide vira uma imagem dentro de um arquivo .pptx — não é editável">📊 Baixar PowerPoint</button>
      <button class="btn-print" id="btnPrint">🖨️ Preparar impressão</button>
    </div>
  </div>

  <div class="sheets" id="sheets"></div>

  <script src="dados-enquetes.js"></script>
  <script>
    /* ════════════════════════════════════════════════════════════════════
       1. ORDEM DOS SLIDES — espelha o `const deck` de index.html.
       ════════════════════════════════════════════════════════════════════ */
    // As telas de enquete saem de dados-enquetes.js, exatamente como no
    // `deck` de index.html — duas telas por enquete (`&p=1` rosca, `&p=2`
    // barras + sugestões); uma só quando ninguém usou o serviço.
    const telasEnquetes = [];
    ['SOG', 'SRG', 'SAF', 'SFC'].forEach((sigla) => {
      ENQUETES.filter((e) => e.sup === sigla)
        .sort((a, b) => a.num - b.num)
        .forEach((e) => {
          const base = 'slide-enquete.html?e=' + e.id;
          telasEnquetes.push(base + '&p=1');
          if (e.q2) telasEnquetes.push(base + '&p=2');
        });
    });

    const files = [
      // Abertura
      'slide-00.html', 'slide-01.html', 'slide-02.html', 'slide-03.html',
      // Bloco 1 · Visão Geral das Ouvidorias públicas
      'capa-bloco-1.html', 'slide-04.html', 'slide-05.html', 'slide-06.html', 'slide-07.html', 'slide-08.html',
      // Bloco 2 · A Ouvidoria da ANTAQ
      'capa-bloco-2.html', 'slide-09.html', 'slide-10.html',
      // Bloco 3 · Carta de Serviços da ANTAQ
      'capa-bloco-3.html', 'slide-11.html', 'slide-carta-32servicos.html?p=1', 'slide-carta-32servicos.html?p=2', 'slide-12.html', 'slide-13.html', 'slide-14.html',
      // Bloco 4 · Conselho de Usuários da ANTAQ
      'capa-bloco-4.html',
      'slide-15.html', 'slide-16.html', 'slide-17.html',
      'slide-18.html', 'slide-19.html',
      'slide-20.html',
      'slide-tabela-enquetes.html?p=1', 'slide-tabela-enquetes.html?p=2',
      ...telasEnquetes,
      // Bloco 5 · Considerações Finais
      'capa-bloco-5.html', 'slide-21.html', 'slide-resultados-perspectivas.html',
      // Bloco 6 · Apêndice
      'capa-bloco-6.html', 'slide-23.html', 'slide-24.html', 'slide-25.html', 'slide-26.html', 'slide-27.html',
    ];

    /* ════════════════════════════════════════════════════════════════════
       2. ANEXOS — slides cujo conteúdo só aparece ao clicar/passar o mouse.
          O conteúdo é lido do próprio arquivo do slide (nada é alterado
          lá) e vira páginas de texto logo depois do slide.
       ════════════════════════════════════════════════════════════════════ */
    const txt = (el, sel) => {
      const n = sel ? el.querySelector(sel) : el;
      return n ? n.textContent.replace(/\s+/g, ' ').trim() : '';
    };

    // Cartões dos apêndices: .tile → nome, etiqueta e o conteúdo do modal
    const lerTile = (el) => ({
      num: txt(el, '.lb-num') || txt(el, '.db-num') || '',
      nome: txt(el, '.tile-name'),
      tag: txt(el, '.tile-tag'),
      desc: txt(el, '.tile-full')
    });

    const ANEXOS = {
      'slide-carta-32servicos.html?p=2': {
        titulo: 'Carta de Serviços da ANTAQ', sel: '.svc-bar',
        ler: el => ({
          num: el.dataset.num || '', nome: el.dataset.title || txt(el, '.sb-name'),
          tag: el.dataset.kicker || '', desc: txt(el, '.sb-desc')
        })
      },
      'slide-23.html': { titulo: 'Decretos', sel: '.tile', ler: lerTile },
      'slide-24.html': { titulo: 'Glossário', sel: '.tile', ler: lerTile },
      'slide-25.html': { titulo: 'Leis', sel: '.tile', ler: lerTile },
      'slide-26.html': { titulo: 'Normativos e Portarias', sel: '.tile', ler: lerTile },
    };

    /* ════════════════════════════════════════════════════════════════════
       3. MONTAGEM DAS PÁGINAS (sem iframe ainda — só o esqueleto)
       ════════════════════════════════════════════════════════════════════ */
    const sheets = document.getElementById('sheets');
    const paginas = [];

    files.forEach((file) => {
      const page = document.createElement('div');
      page.className = 'page';
      page.dataset.file = file;
      const ph = document.createElement('div');
      ph.className = 'ph';
      ph.innerHTML = '<b>' + file.replace('.html', '') + '</b><span>slide carregado ao aproximar</span>';
      page.appendChild(ph);
      sheets.appendChild(page);
      paginas.push(page);
    });

    function montar(page) {
      if (page.dataset.montado === '1' || !page.dataset.file) return null;
      page.dataset.montado = '1';
      const frame = document.createElement('iframe');
      frame.setAttribute('scrolling', 'no');
      frame.setAttribute('tabindex', '-1');
      frame.title = 'Slide: ' + page.dataset.file.replace('.html', '').replace(/[-_]/g, ' ');
      frame.src = page.dataset.file;
      page.appendChild(frame);
      return frame;
    }

    function desmontar(page) {
      if (page.dataset.montado !== '1' || page.dataset.fixo === '1') return;
      const f = page.querySelector('iframe');
      if (f) f.remove();
      page.dataset.montado = '0';
    }

    /* Só o que está perto da tela fica montado → navegação leve */
    const perto = new IntersectionObserver((entries) => {
      entries.forEach(e => e.isIntersecting ? montar(e.target) : null);
    }, { rootMargin: '150% 0px' });

    const longe = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (!e.isIntersecting) desmontar(e.target); });
    }, { rootMargin: '400% 0px' });

    paginas.forEach(p => { perto.observe(p); longe.observe(p); });

    /* ════════════════════════════════════════════════════════════════════
       4. ANEXOS — lê os arquivos, quebra em páginas pela altura real
       ════════════════════════════════════════════════════════════════════ */
    function novaPaginaAnexo(titulo, parte) {
      const page = document.createElement('div');
      page.className = 'page annex';
      page.innerHTML =
        '<div class="annex-head">' +
        '<span class="annex-kicker">Anexo</span>' +
        '<p class="annex-title"></p>' +
        '<span class="annex-cont"></span>' +
        '</div><div class="annex-grid"><div class="annex-col"></div><div class="annex-col"></div></div>' +
        '<div class="annex-foot"><span>Relatório Anual de Enquetes do Conselho de Usuários · 2026 – Ouvidoria – ANTAQ</span>' +
        '<span>conteúdo dos cartões interativos do slide</span></div>';
      page.querySelector('.annex-title').textContent = titulo;
      page.querySelector('.annex-cont').textContent = parte > 1 ? '(continuação ' + parte + ')' : '';
      return page;
    }

    function itemHTML(it) {
      const d = document.createElement('div');
      d.className = 'annex-item';
      let h = '<div class="ai-top">';
      if (it.num) h += '<span class="ai-num">' + it.num + '</span>';
      h += '<span class="ai-name"></span></div>';
      if (it.tag) h += '<p class="ai-tag"></p>';
      if (it.desc) h += '<p class="ai-desc"></p>';
      if (it.src) h += '<p class="ai-src"></p>';
      d.innerHTML = h;
      d.querySelector('.ai-name').textContent = it.nome;
      if (it.tag) d.querySelector('.ai-tag').textContent = it.tag;
      if (it.desc) d.querySelector('.ai-desc').textContent = it.desc;
      if (it.src) d.querySelector('.ai-src').textContent = 'fonte: ' + it.src;
      return d;
    }

    async function gerarAnexos() {
      for (const [file, cfg] of Object.entries(ANEXOS)) {
        const base = paginas.find(p => p.dataset.file === file);
        if (!base) continue;
        let html;
        try {
          html = await (await fetch(file)).text();
        } catch (e) { continue; }
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const itens = [...doc.querySelectorAll(cfg.sel)].map(cfg.ler).filter(i => i.nome);
        if (!itens.length) continue;

        let parte = 1;
        let page = novaPaginaAnexo(cfg.titulo, parte);
        base.after(page);
        let ancora = page;
        let cols = [...page.querySelectorAll('.annex-col')];
        let ic = 0;

        for (const it of itens) {
          let el = itemHTML(it);
          cols[ic].appendChild(el);
          // Coube? segue. Estourou? tenta a próxima coluna; se não houver,
          // abre nova página. Um item nunca é descartado.
          if (cols[ic].scrollHeight > cols[ic].clientHeight + 1) {
            cols[ic].removeChild(el);
            ic++;
            if (ic >= cols.length) {
              parte++;
              page = novaPaginaAnexo(cfg.titulo, parte);
              ancora.after(page);
              ancora = page;
              cols = [...page.querySelectorAll('.annex-col')];
              ic = 0;
            }
            cols[ic].appendChild(el);
            // item gigante que não cabe nem numa coluna vazia: deixa passar
            // (a coluna tem overflow hidden só como segurança visual)
          }
        }
      }
    }

    /* ════════════════════════════════════════════════════════════════════
       5. PREPARAR IMPRESSÃO — monta tudo em lotes e espera carregar
       ════════════════════════════════════════════════════════════════════ */
    const btn = document.getElementById('btnPrint');
    const prog = document.getElementById('prog');
    const barra = prog.querySelector('i');

    function esperar(frame) {
      return new Promise(res => {
        if (!frame) return res();
        let pronto = false;
        const ok = () => { if (!pronto) { pronto = true; res(); } };
        frame.addEventListener('load', () => setTimeout(ok, 220));
        setTimeout(ok, 6000); // rede lenta não trava a fila
      });
    }

    async function prepararEImprimir() {
      btn.disabled = true;
      prog.classList.add('on');
      const alvos = paginas.filter(p => p.dataset.file);
      const LOTE = 4;
      for (let i = 0; i < alvos.length; i += LOTE) {
        const lote = alvos.slice(i, i + LOTE);
        await Promise.all(lote.map(p => {
          p.dataset.fixo = '1';               // não desmontar mais
          const f = p.querySelector('iframe') || montar(p);
          return p.dataset.montado === '1' && f && !f.dataset.pronto
            ? esperar(f).then(() => { f.dataset.pronto = '1'; })
            : Promise.resolve();
        }));
        barra.style.width = Math.round(((i + LOTE) / alvos.length) * 100) + '%';
      }
      barra.style.width = '100%';
      btn.textContent = '🖨️ Imprimir / Salvar PDF';
      btn.disabled = false;
      btn.onclick = () => window.print();
      setTimeout(() => { prog.classList.remove('on'); window.print(); }, 400);
    }

    btn.addEventListener('click', prepararEImprimir);

    // Ctrl+P direto: pelo menos monta tudo (pode não dar tempo de carregar)
    window.addEventListener('beforeprint', () => {
      paginas.forEach(p => { p.dataset.fixo = '1'; montar(p); });
    });

    // Guardada porque o PowerPoint precisa esperar os anexos existirem.
    const anexosProntos = gerarAnexos();

    /* ════════════════════════════════════════════════════════════════════
       6. BAIXAR POWERPOINT (cru) — cada página vira uma imagem dentro do
          .pptx: os slides são capturados numa iframe escondida de
          1920×1080, e as páginas de anexo, direto do DOM daqui. Não mexe
          nos iframes de `.sheets` usados pela impressão, nem nos arquivos
          de slide — todo ajuste de captura é injetado na hora.
       ════════════════════════════════════════════════════════════════════ */
    const btnPptx = document.getElementById('btnPptx');

    /* Cada imagem sai em 3840×2160 (o dobro do canvas do deck): o texto
       aguenta zoom e projeção sem serrilhar. */
    const PPTX_LARGURA = 3840;
    const PPTX_JPEG = 0.9;

    /* CSS que vale só durante a captura.
       Animação e transição morrem para o print não pegar um quadro do meio
       do caminho — mas SEM tocar em `opacity`/`transform`: forçar
       `opacity:1` acendia os overlays fechados dos slides 19 e 23 a 26
       (que se escondem só com `opacity:0`, sem `visibility`/`display`), e
       o .pptx saía com um véu azul e um cartão modal por cima do slide.
       O que é transitório por natureza sai de cena de vez. */
    const CSS_CAPTURA =
      '*{animation:none!important;transition:none!important}' +
      '.overlay,.ctx-overlay,.svc-pop{display:none!important}';

    /* Ajustes por slide — a chave é o arquivo sem a query string, porque as
       telas de enquete chegam como `slide-enquete.html?e=8270&p=1`. */
    const AJUSTES_CAPTURA = {
      // O slide já tem o modo de visão geral pronto (`body.modo-grade`):
      // captura as 5 etapas em vez da etapa 1 sozinha, que é o estado
      // inicial e o que vinha saindo no PowerPoint.
      'slide-19.html': { classeBody: 'modo-grade', esconder: '.dicas, .ctx-bar .ctx-btn' },
      // Mesmo caso: as 3 perspectivas (25 resultados) em vez da 1ª sozinha.
      'slide-resultados-perspectivas.html': { classeBody: 'modo-grade', esconder: '.dicas, .ctx-bar .ctx-btn' },
      // Controles que só servem com mouse — numa imagem estática são ruído.
      'slide-14.html': { esconder: '.filtro' },
      'slide-enquete.html': { esconder: '.btn-modo' },
    };

    function imagemParaDataUrl(src) {
      return fetch(src)
        .then((res) => res.blob())
        .then((blob) => new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        }));
    }

    function injetarStyle(doc, css) {
      const st = doc.createElement('style');
      st.textContent = css;
      doc.head.appendChild(st);
      return st;
    }

    /* Fontes embutidas. No modo foreignObjectRendering o navegador não
       carrega recurso externo: Font Awesome e Google Fonts não chegam na
       captura, então os ícones saíam vazios e o texto caía numa fonte de
       sistema — com métrica diferente, o que desalinhava e cortava frases.
       Baixar o CSS das fontes e trocar cada url() por um data: URI resolve.
       Roda uma vez só e o resultado serve para as ~100 páginas. */
    let cssFontes = null;
    async function carregarFontesInline() {
      if (cssFontes !== null) return cssFontes;
      const folhas = [
        'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css',
        'https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&family=Open+Sans:ital,wght@0,400;0,600;1,400&display=swap',
      ];
      let out = '';
      for (const href of folhas) {
        try {
          let css = await (await fetch(href)).text();
          // O CSS do Font Awesome aponta os arquivos por caminho relativo
          // (`../webfonts/…`), daí resolver contra o href da folha.
          for (const m of [...css.matchAll(/url\((['"]?)([^)'"]+)\1\)/g)]) {
            if (!/\.(woff2?|ttf)(\?|$)/i.test(m[2])) continue;
            try {
              const dataUrl = await imagemParaDataUrl(new URL(m[2], href).href);
              css = css.replace(m[0], 'url(' + dataUrl + ')');
            } catch (e) { /* mantém a URL original se a rede falhar */ }
          }
          out += css + '\n';
        } catch (e) { /* folha indisponível: segue sem ela */ }
      }
      cssFontes = out;
      return out;
    }

    // O html2canvas com foreignObjectRendering (necessário pro CSS do
    // Tailwind vindo de CDN renderizar certo) não embute direito <img> de
    // documentos dentro de iframe — troca o `src` por um data: URI antes
    // da captura, senão a logomarca das capas sai quebrada no .pptx.
    async function inlinarImagens(doc) {
      const imgs = Array.from(doc.querySelectorAll('img'));
      await Promise.all(imgs.map(async (img) => {
        const src = img.getAttribute('src');
        if (!src || src.startsWith('data:')) return;
        try {
          img.src = await imagemParaDataUrl(new URL(src, doc.baseURI).href);
        } catch (e) { /* mantém como está se falhar */ }
      }));
    }

    function prepararIframePptx(iframe, src) {
      return new Promise((resolve) => {
        iframe.addEventListener('load', async function onLoad() {
          iframe.removeEventListener('load', onLoad);
          try {
            const doc = iframe.contentDocument;
            injetarStyle(doc, CSS_CAPTURA);
            if (cssFontes) injetarStyle(doc, cssFontes);

            const ajuste = AJUSTES_CAPTURA[src.split('?')[0]];
            if (ajuste) {
              if (ajuste.classeBody) doc.body.classList.add(ajuste.classeBody);
              if (ajuste.esconder) injetarStyle(doc, ajuste.esconder + '{display:none!important}');
            }

            await inlinarImagens(doc);
            // Sem esperar a fonte ficar pronta, a captura pega o texto no
            // fallback e a métrica muda.
            if (doc.fonts && doc.fonts.ready) await doc.fonts.ready;
          } catch (e) { /* segue mesmo assim */ }
          requestAnimationFrame(() => requestAnimationFrame(resolve));
        });
        iframe.src = src;
      });
    }

    async function gerarPPTX() {
      const original = btnPptx.textContent;
      btnPptx.disabled = true;

      // 1920×1080: os slides usam `html{font-size:26px}` fixo (não relativo
      // ao viewport) — capturar numa largura menor faz título/cards
      // quebrarem linha de um jeito que o CSS não previu, sobrepondo
      // conteúdo. 1920×1080 é a resolução em que o deck foi desenhado.
      const stage = document.createElement('iframe');
      stage.style.cssText = 'position:fixed; left:-99999px; top:0; width:1920px; height:1080px; border:0;';
      document.body.appendChild(stage);

      try {
        btnPptx.textContent = 'Preparando…';
        // Os anexos são montados de forma assíncrona no carregamento da
        // página; sem esperar, o .pptx pode sair sem eles.
        await anexosProntos;
        await carregarFontesInline();
        // As páginas de anexo são capturadas do DOM deste documento, então
        // ele também precisa das fontes embutidas — uma vez só.
        if (cssFontes && !document.body.dataset.fontesPptx) {
          injetarStyle(document, cssFontes);
          document.body.dataset.fontesPptx = '1';
          if (document.fonts && document.fonts.ready) await document.fonts.ready;
        }

        // Monta todos os slides em lotes, do mesmo jeito que a impressão faz.
        const alvos = paginas.filter(p => p.dataset.file);
        const LOTE = 4;
        for (let i = 0; i < alvos.length; i += LOTE) {
          const lote = alvos.slice(i, i + LOTE);
          await Promise.all(lote.map(p => {
            p.dataset.fixo = '1';
            const f = p.querySelector('iframe') || montar(p);
            return p.dataset.montado === '1' && f && !f.dataset.pptxPronto
              ? esperar(f).then(() => { f.dataset.pptxPronto = '1'; })
              : Promise.resolve();
          }));
        }

        // Ordem do documento: cada anexo já está logo depois do slide de
        // origem, então percorrer as páginas dá a sequência final do .pptx.
        const paginasPptx = [...document.querySelectorAll('#sheets .page')];
        const pptx = new PptxGenJS();
        pptx.layout = 'LAYOUT_WIDE';

        for (let i = 0; i < paginasPptx.length; i++) {
          const page = paginasPptx[i];
          btnPptx.textContent = 'Gerando ' + (i + 1) + '/' + paginasPptx.length + '…';
          let canvas;
          if (page.dataset.file) {
            await prepararIframePptx(stage, page.dataset.file);
            canvas = await html2canvas(stage.contentDocument.body, {
              foreignObjectRendering: true,
              useCORS: true,
              width: 1920,
              height: 1080,
              scale: PPTX_LARGURA / 1920,
              backgroundColor: '#ffffff'
            });
          } else {
            // Página de anexo: DOM comum, CSS local, sem Tailwind de CDN —
            // o renderizador padrão do html2canvas dá conta e sai mais fiel
            // do que o foreignObject.
            canvas = await html2canvas(page, {
              useCORS: true,
              scale: PPTX_LARGURA / page.offsetWidth,
              backgroundColor: '#ffffff'
            });
          }
          pptx.addSlide().addImage({ data: canvas.toDataURL('image/jpeg', PPTX_JPEG), x: 0, y: 0, w: 13.333, h: 7.5 });
        }

        btnPptx.textContent = 'Salvando…';
        await pptx.writeFile({ fileName: 'Relatorio-Conselho-Usuarios-2026.pptx' });
      } catch (err) {
        console.error('Falha ao gerar o PowerPoint:', err);
        alert('Não foi possível gerar o PowerPoint. Veja o console para detalhes.');
      } finally {
        document.body.removeChild(stage);
        btnPptx.textContent = original;
        btnPptx.disabled = false;
      }
    }

    btnPptx.addEventListener('click', gerarPPTX);
  </script>
  <script src="a11y.js" defer></script>
</body>

</html>
