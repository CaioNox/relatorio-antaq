<!DOCTYPE html>

<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Resultado da enquete — Relatório Anual de Enquetes · Ouvidoria ANTAQ</title>
  <link rel="icon" type="image/png"
    href="https://prd-apex.antaq.gov.br/ords/r/sfc/120/files/static/v119/icons/app-icon-32.png" />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&family=Open+Sans:ital,wght@0,400;0,600;1,400&display=swap"
    rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #f3f4f6;
      font-family: 'Open Sans', sans-serif;
    }

    .slide {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #fff;
      overflow: hidden;

      padding-bottom: 6vh;
    }

    .top-accent {
      height: 8px;
      background: #103050;
    }

    .top-accent-secondary {
      height: 4px;
      background: #0070C0;
    }


    .head {
      flex-shrink: 0;
      padding: 16px 56px 0;
    }

    .sup-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 32px;
      font-weight: 800;
      color: #103050;
      text-transform: uppercase;
      text-align: center;
      letter-spacing: -.01em;
      line-height: 1.12;
      margin: 0;
    }

    .id-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 30px;
      margin-top: 10px;
    }

    .enq-id {
      font-family: 'Montserrat', sans-serif;
      font-size: 23px;
      font-weight: 800;
      color: #103050;
      line-height: 1.25;
    }

    .enq-id small {
      display: block;
      font-size: 16px;
      font-weight: 600;
      color: #475569;
      letter-spacing: .02em;
      text-transform: uppercase;
      margin-top: 2px;
    }


    .parte-tag {
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
      vertical-align: 3px;
      margin-left: 14px;
      background: #0070C0;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      padding: 4px 16px;
      border-radius: 999px;
      box-shadow: 0 2px 7px rgba(0, 112, 192, .3);
    }

    .parte-tag b {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: .01em;
    }

    .servico-tag {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      background: #103050;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 6px 17px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    .pergunta {
      margin-top: 10px;
      background: #EDF0F3;
      border-radius: 6px;
      padding: 8px 18px;
      font-size: 22px;
      font-weight: 600;
      color: #1E293B;
      line-height: 1.3;
    }

    .respondentes {
      margin-top: 6px;
      background: #EAF4FC;
      border-left: 5px solid #0070C0;
      border-radius: 0 6px 6px 0;
      padding: 7px 18px;
      font-size: 18px;
      color: #334155;
    }

    .respondentes b {
      color: #103050;
    }


    .grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr;
      gap: 0 30px;
      padding: 12px 56px 6px;
    }

    .grid.solo {
      grid-template-columns: 1.15fr 1fr;
      align-items: stretch;
    }

    .card {
      display: flex;
      flex-direction: column;
      min-height: 0;
      animation: fadeIn .45s ease both;
    }

    .card:nth-child(2) {
      animation-delay: .09s;
    }

    .card-head {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    .q-tag {
      font-family: 'Montserrat', sans-serif;
      font-size: 15px;
      font-weight: 800;
      color: #0070C0;
      background: #DDEAF6;
      border-radius: 6px;
      padding: 3px 10px;
      letter-spacing: .05em;
      flex-shrink: 0;
    }

    .q-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: #103050;
      line-height: 1.2;
    }


    .btn-modo {
      margin-left: auto;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: #fff;
      border: 1px solid #CBD5E1;
      border-radius: 999px;
      color: #475569;
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      padding: 5px 13px;
      cursor: pointer;
      transition: background .18s, border-color .18s, color .18s;
    }

    .btn-modo:hover,
    .btn-modo:focus-visible {
      background: #EAF4FC;
      border-color: #0070C0;
      color: #0070C0;
      outline: none;
    }

    .card-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chart-box {
      flex: 1;
      min-height: 0;
      position: relative;
      border: 1px solid #E5E9EF;
      border-radius: 12px;
      background: #fff;
      padding: 10px 12px;
    }

    .chart-box canvas {
      transition: opacity .2s ease;
    }


    .tabela-wrap {
      position: absolute;
      inset: 10px 12px;
      overflow: hidden;
      display: none;
    }

    .card.modo-tabela .tabela-wrap {
      display: flex;
      align-items: center;
      animation: fadeIn .3s ease both;
    }

    .card.modo-tabela canvas {
      visibility: hidden;
    }

    table.numeros {
      width: 100%;
      border-collapse: collapse;
      font-size: 21px;
    }

    table.numeros th {
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: #64748B;
      text-align: left;
      padding: 0 12px 8px;
      border-bottom: 2px solid #E2E8F0;
    }

    table.numeros td {
      padding: 11px 12px;
      border-bottom: 1px solid #EEF2F7;
      color: #1E293B;
    }

    table.numeros tr:last-child td {
      border-bottom: none;
    }

    table.numeros .n {
      text-align: right;
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      color: #103050;
      white-space: nowrap;
    }

    table.numeros .chip {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 4px;
      margin-right: 10px;
      vertical-align: -2px;
    }

    table.numeros tr.zero td {
      color: #94A3B8;
    }


    table.numeros tr.on td {
      background: #EAF4FC;
    }


    .analise {
      flex-shrink: 0;
      max-height: 158px;
      overflow: hidden;
      background: #fff;
      border: 1px solid #94A3B8;
      border-radius: 10px;
      padding: 11px 16px;
      font-size: 19px;
      line-height: 1.4;
      color: #1E293B;
    }

    .analise b {
      color: #103050;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
    }


    .seg {
      border-radius: 4px;
      padding: 0 2px;
      margin: 0 -2px;
      cursor: default;
      transition: background .16s ease, color .16s ease;
    }

    .seg.on {
      background: #DDEAF6;
      color: #0A2540;
    }


    .aviso {
      border: 2px dashed #CBD5E1;
      border-radius: 16px;
      background: #F8FAFC;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
      gap: 16px;
      animation: fadeIn .45s ease both .09s;
    }

    .aviso i {
      font-size: 62px;
      color: #94A3B8;
    }

    .aviso h3 {
      font-family: 'Montserrat', sans-serif;
      font-size: 27px;
      font-weight: 800;
      color: #103050;
      margin: 0;
    }

    .aviso p {
      font-size: 19px;
      color: #64748B;
      max-width: 620px;
      line-height: 1.5;
      margin: 0;
    }


    .sug {
      flex-shrink: 0;
      margin: 0 56px 6px;
      border-top: 2px solid #E2E8F0;
      padding-top: 10px;
      max-height: 292px;
      overflow: hidden;
    }

    .sug-head {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 7px;
    }

    .sug-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .sug-list li {
      position: relative;
      padding-left: 22px;
      font-size: var(--sug-fs, 21px);
      line-height: 1.38;
      color: #1E293B;
      text-align: justify;
    }

    .sug-list li::before {
      content: "";
      position: absolute;
      left: 4px;
      top: .5em;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #0070C0;
    }

    .sug-vazio {
      font-size: 19px;
      color: #94A3B8;
      font-style: italic;
      margin: 0;
    }


    .foot {
      flex-shrink: 0;
      padding: 0 56px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .foot p {
      margin: 0;
      font-size: 12px;
      color: #94A3B8;
    }

    .nota {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      background: #FFF7E6;
      border: 1px solid #F2A900;
      border-radius: 7px;
      padding: 5px 11px;
      font-size: 12.5px;
      line-height: 1.35;
      color: #7A5200;
      max-width: 1180px;
    }

    .nota i {
      color: #F2A900;
      margin-top: 1px;
    }

    .nota b {
      font-family: 'Montserrat', sans-serif;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-size: 11px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
  <link rel="stylesheet" href="a11y.css">
</head>

<body>
  <div class="slide">
    <div class="top-accent"></div>
    <div class="top-accent-secondary"></div>

    <div class="head">
      <h1 class="sup-title" id="supTitle"></h1>
      <div class="id-row">
        <div class="enq-id" id="enqId"></div>
        <div class="servico-tag" id="servicoTag"></div>
      </div>
      <div class="pergunta" id="pergunta"></div>
      <div class="respondentes" id="respondentes"></div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="sug" id="sug"></div>

    <div class="foot">
      <div id="notaBox"></div>
      <p>Relatório Anual de Enquetes do Conselho de Usuários · 2026 – Ouvidoria – Agência Nacional de Transportes
        Aquaviários - ANTAQ</p>
    </div>
  </div>

  <script src="dados-enquetes.js"></script>
  <script>
    (function () {
      var COR_SIM = '#0070C0', COR_NAO = '#103050', COR_NOTA = '#0090C0';

      var params = new URLSearchParams(location.search);
      var id = params.get('e');
      var e = acharEnquete(id);
      if (!e) {
        document.getElementById('supTitle').textContent = 'Enquete não encontrada (' + id + ')';
        return;
      }



      var semUso = !e.q2;
      var partes = semUso ? 1 : 2;
      var parte = Number(params.get('p')) === 2 && !semUso ? 2 : 1;

      var sup = SUPERINTENDENCIAS[e.sup];
      var pad = function (n) { return n < 10 ? '0' + n : String(n); };


      document.getElementById('supTitle').textContent =
        'Serviços prestados pela ' + sup.nome + ' — ' + sup.sigla;
      document.getElementById('enqId').innerHTML =
        'Enquete nº ' + e.id +
        '<span class="parte-tag">Parte <b>' + parte + '/' + partes + '</b></span>' +
        '<small>Data de publicação ' + e.publicacao + '</small>';
      document.getElementById('servicoTag').innerHTML =
        '<i class="fa-solid fa-file-lines"></i>' + sup.sigla + ' · Serviço ' + pad(e.num);
      document.getElementById('pergunta').textContent = e.pergunta;
      document.getElementById('respondentes').innerHTML =
        'Essa consulta foi respondida por <b>' + e.respondentes + '</b> ' +
        (e.respondentes === 1 ? 'conselheiro' : 'conselheiros') +
        (e.base ? ' de um total de <b>' + e.base + '</b>' : '') + '.';

      if (e.nota) {
        document.getElementById('notaBox').innerHTML =
          '<div class="nota"><i class="fa-solid fa-triangle-exclamation"></i><span><b>Ressalva de fonte</b> ' +
          e.nota + '</span></div>';
      }




      function rgba(hex, a) {
        return 'rgba(' + parseInt(hex.substr(1, 2), 16) + ',' +
          parseInt(hex.substr(3, 2), 16) + ',' + parseInt(hex.substr(5, 2), 16) + ',' + a + ')';
      }





      var reajustes = [];
      function caberNaCaixa(el, escala, aplicar) {
        var rodar = function () {
          for (var i = 0; i < escala.length; i++) {
            aplicar(escala[i]);
            if (el.scrollHeight <= el.clientHeight + 1) return;
          }
        };
        reajustes.push(rodar);
        rodar();
      }
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () {
          reajustes.forEach(function (r) { r(); });
        });
      }


      var sugEl = document.getElementById('sug');
      if (parte === 2) {
        var sugs = e.sugestoes || [];
        sugEl.innerHTML =
          '<div class="sug-head"><span class="q-tag">05</span>' +
          '<span class="q-title">Deixe aqui sua sugestão para melhoria do serviço.</span></div>' +
          (sugs.length
            ? '<ul class="sug-list">' + sugs.map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ul>'
            : '<p class="sug-vazio">Não houve sugestões registradas para este serviço.</p>');




        caberNaCaixa(sugEl, [21, 20, 19, 18, 17, 16, 15], function (px) {
          sugEl.style.setProperty('--sug-fs', px + 'px');
        });
      } else {
        sugEl.style.display = 'none';
      }


      var grid = document.getElementById('grid');
      if (semUso) grid.classList.add('solo');

      function card(tag, titulo, canvasId, rotuloAria) {
        var d = document.createElement('div');
        d.className = 'card';
        d.innerHTML =
          '<div class="card-head"><span class="q-tag">' + tag + '</span>' +
          '<span class="q-title">' + titulo + '</span>' +
          '<button type="button" class="btn-modo"><i class="fa-solid fa-table-list"></i>' +
          '<span class="btn-modo-txt">Ver números</span></button></div>' +
          '<div class="card-body">' +
          '<div class="chart-box">' +
          '<canvas id="' + canvasId + '" role="img" aria-label="' + rotuloAria + '"></canvas>' +
          '<div class="tabela-wrap"></div>' +
          '</div>' +
          '<div class="analise"><b>Análise:</b> </div>' +
          '</div>';
        grid.appendChild(d);

        var btn = d.querySelector('.btn-modo');
        btn.addEventListener('click', function () {
          var tabela = d.classList.toggle('modo-tabela');
          d.querySelector('.btn-modo-txt').textContent = tabela ? 'Ver gráfico' : 'Ver números';
          btn.querySelector('i').className = tabela ? 'fa-solid fa-chart-simple' : 'fa-solid fa-table-list';
        });
        return d;
      }


      function ligarRealce(cartao, chart, chaves, pintar, podeRealcar) {
        var st = { foco: null, realce: null };
        var segs = cartao.querySelectorAll('.seg');
        var linhas = cartao.querySelectorAll('table.numeros tbody tr');

        function ativo() { return st.foco !== null ? st.foco : st.realce; }

        function sincronizar() {
          var i = ativo();
          var chave = i === null ? null : chaves[i];
          segs.forEach(function (s) { s.classList.toggle('on', chave !== null && s.dataset.seg === chave); });
          linhas.forEach(function (tr, k) { tr.classList.toggle('on', i !== null && k === i); });
          chart.update('none');
        }

        function realcar(i) {
          if (i !== null && podeRealcar && !podeRealcar(i)) i = null;
          if (i === st.realce) return;
          st.realce = i;
          sincronizar();
        }

        pintar.ativo = ativo;
        chart.options.onHover = function (evt, els) {
          realcar(els.length ? els[0].index : null);
        };
        chart.canvas.addEventListener('mouseleave', function () { realcar(null); });


        cartao.addEventListener('mouseleave', function () { realcar(null); });


        segs.forEach(function (s) {
          s.addEventListener('mouseenter', function () { realcar(chaves.indexOf(s.dataset.seg)); });
          s.addEventListener('mouseleave', function () { realcar(null); });
        });
        linhas.forEach(function (tr, k) {
          tr.addEventListener('mouseenter', function () { realcar(k); });
          tr.addEventListener('mouseleave', function () { realcar(null); });
        });

        return {
          focar: function (i) { st.foco = st.foco === i ? null : i; sincronizar(); },
          sincronizar: sincronizar
        };
      }


      function escreverAnalise(cartao, questao) {
        var caixa = cartao.querySelector('.analise');
        var html = '<b>Análise:</b> ';
        segmentosAnalise(e, questao).forEach(function (s) {
          var t = s.texto.replace(/&/g, '&amp;').replace(/</g, '&lt;');
          html += s.chave ? '<span class="seg" data-seg="' + s.chave + '">' + t + '</span>' : t;
        });
        caixa.innerHTML = html;
        caberNaCaixa(caixa, [19, 18, 17, 16, 15, 14], function (px) { caixa.style.fontSize = px + 'px'; });
      }


      function pizzaCard(tag, titulo, dados, canvasId, questao) {
        var total = dados.sim + dados.nao;
        var itens = [];
        if (dados.sim > 0) itens.push({ rot: 'SIM', v: dados.sim, cor: COR_SIM, chave: 'sim' });
        if (dados.nao > 0) itens.push({ rot: 'NÃO', v: dados.nao, cor: COR_NAO, chave: 'nao' });

        var aria = itens.map(function (i) {
          return i.rot + ': ' + i.v + ' de ' + total + ' (' + pct(i.v, total) + ')';
        }).join('; ');

        var cartao = card(tag, titulo, canvasId, aria);
        escreverAnalise(cartao, questao);


        cartao.querySelector('.tabela-wrap').innerHTML =
          '<table class="numeros"><thead><tr><th scope="col">Resposta</th><th scope="col" style="text-align:right">Respostas</th>' +
          '<th scope="col" style="text-align:right">Percentual</th></tr></thead><tbody>' +
          itens.map(function (i) {
            return '<tr><td><span class="chip" style="background:' + i.cor + '"></span>' + i.rot + '</td>' +
              '<td class="n">' + i.v + '</td><td class="n">' + pct(i.v, total) + '</td></tr>';
          }).join('') + '</tbody></table>';

        var pintar = {};
        var chart = new Chart(document.getElementById(canvasId), {
          type: 'doughnut',
          data: {
            labels: itens.map(function (i) { return i.rot; }),
            datasets: [{
              data: itens.map(function (i) { return i.v; }),
              backgroundColor: function (c) {
                var a = pintar.ativo ? pintar.ativo() : null;
                return a === null || a === c.dataIndex
                  ? itens[c.dataIndex].cor
                  : rgba(itens[c.dataIndex].cor, .2);
              },
              borderColor: '#fff', borderWidth: 4, hoverOffset: 14
            }]
          },
          options: {
            responsive: true, maintainAspectRatio: false, cutout: '42%',
            animation: false,
            layout: { padding: 8 },
            plugins: {
              legend: {
                position: 'right',
                onClick: function (evt, item) { realce.focar(item.index); },
                labels: {
                  font: { family: 'Open Sans', size: 18, weight: '600' },
                  color: '#334155', boxWidth: 18, padding: 16,
                  generateLabels: function () {
                    var a = pintar.ativo ? pintar.ativo() : null;
                    return itens.map(function (i, k) {
                      return {
                        text: i.rot, index: k,
                        fillStyle: a === null || a === k ? i.cor : rgba(i.cor, .2),
                        strokeStyle: '#fff', lineWidth: 2,
                        fontColor: a === null || a === k ? '#334155' : '#A3AFBF'
                      };
                    });
                  }
                }
              },
              tooltip: {
                titleFont: { family: 'Montserrat', size: 16, weight: '700' },
                bodyFont: { family: 'Open Sans', size: 16 },
                padding: 12, displayColors: false,
                callbacks: {
                  title: function (c) { return c[0].label; },
                  label: function (c) {
                    return c.parsed + ' ' + plural(c.parsed, 'conselheiro', 'conselheiros') +
                      ' (' + pct(c.parsed, total) + ')';
                  }
                }
              }
            }
          },
          plugins: [{
            id: 'rotulos',
            afterDatasetsDraw: function (chart) {
              var ctx = chart.ctx;
              ctx.save();
              ctx.font = '700 26px Montserrat, sans-serif';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              chart.getDatasetMeta(0).data.forEach(function (arc, i) {
                var txt = pct(itens[i].v, total);
                var p = arc.tooltipPosition();


                var apagada = String(arc.options.backgroundColor).indexOf('rgba') === 0;


                var angulo = Math.abs(arc.endAngle - arc.startAngle);
                var corda = 2 * ((arc.outerRadius + arc.innerRadius) / 2) * Math.sin(Math.min(angulo, Math.PI) / 2);
                if (ctx.measureText(txt).width + 12 <= corda) {
                  ctx.fillStyle = apagada ? '#64748B' : '#fff';
                  ctx.fillText(txt, p.x, p.y);
                } else {
                  var m = (arc.startAngle + arc.endAngle) / 2;
                  ctx.fillStyle = apagada ? '#94A3B8' : itens[i].cor;
                  ctx.fillText(txt,
                    arc.x + Math.cos(m) * (arc.outerRadius + 26),
                    arc.y + Math.sin(m) * (arc.outerRadius + 26));
                }
              });
              ctx.restore();
            }
          }]
        });

        var realce = ligarRealce(cartao, chart, itens.map(function (i) { return i.chave; }), pintar);
        return chart;
      }


      function barrasCard(tag, titulo, notas, canvasId, questao) {
        var max = Math.max.apply(null, notas);
        var totalNotas = notas.reduce(function (a, b) { return a + b; }, 0);

        var aria = ESCALA_NOTAS.map(function (r, i) {
          return 'nota ' + (i + 1) + ' (' + r + '): ' + notas[i];
        }).join('; ');

        var cartao = card(tag, titulo, canvasId, aria);
        escreverAnalise(cartao, questao);

        cartao.querySelector('.tabela-wrap').innerHTML =
          '<table class="numeros"><thead><tr><th scope="col">Nota</th><th scope="col">Classificação</th>' +
          '<th scope="col" style="text-align:right">Respostas</th></tr></thead><tbody>' +
          ESCALA_NOTAS.map(function (r, i) {
            return '<tr' + (notas[i] ? '' : ' class="zero"') + '>' +
              '<td><span class="chip" style="background:' + (notas[i] ? COR_NOTA : '#CBD5E1') + '"></span>' +
              (i + 1) + '</td><td>' + r + '</td><td class="n">' + notas[i] + '</td></tr>';
          }).join('') + '</tbody></table>';

        var pintar = {};
        var chart = new Chart(document.getElementById(canvasId), {
          type: 'bar',
          data: {
            labels: ESCALA_NOTAS.map(function (r, i) { return (i + 1) + ' · ' + r; }),
            datasets: [{
              data: notas, borderRadius: 6, maxBarThickness: 96,
              backgroundColor: function (c) {
                var a = pintar.ativo ? pintar.ativo() : null;
                return a === null || a === c.dataIndex ? COR_NOTA : rgba(COR_NOTA, .28);
              }
            }]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            animation: false,
            layout: { padding: { top: 26 } },
            interaction: { mode: 'index', intersect: false },
            plugins: {
              legend: { display: false },
              tooltip: {
                filter: function (item) { return item.parsed.y > 0; },
                titleFont: { family: 'Montserrat', size: 16, weight: '700' },
                bodyFont: { family: 'Open Sans', size: 16 },
                padding: 12, displayColors: false,
                callbacks: {
                  label: function (c) {
                    return c.parsed.y + ' ' + plural(c.parsed.y, 'conselheiro', 'conselheiros') +
                      (totalNotas ? ' (' + pct(c.parsed.y, totalNotas) + ')' : '');
                  }
                }
              }
            },
            scales: {
              x: { grid: { display: false }, ticks: { color: '#374151', font: { size: 16, weight: '600' } } },
              y: {




                beginAtZero: true, max: (max || 1) + Math.max(0.4, max * 0.2),
                grid: { color: '#eef2f7' },
                ticks: {
                  stepSize: 1, precision: 0, color: '#9ca3af', font: { size: 15 },


                  callback: function (v) { return v % 1 === 0 ? v : ''; }
                }
              }
            }
          },
          plugins: [{
            id: 'valores',
            afterDatasetsDraw: function (chart) {
              var ctx = chart.ctx;
              ctx.save();
              ctx.font = '700 24px Montserrat, sans-serif';
              ctx.fillStyle = '#103050';
              ctx.textAlign = 'center';
              chart.getDatasetMeta(0).data.forEach(function (bar, i) {
                if (notas[i] > 0) ctx.fillText(notas[i], bar.x, bar.y - 10);
              });
              ctx.restore();
            }
          }]
        });


        ligarRealce(cartao, chart, notas.map(function (v, i) { return 'n' + (i + 1); }), pintar,
          function (i) { return notas[i] > 0; });
        return chart;
      }


      if (parte === 1) {
        pizzaCard('01', 'Você já utilizou esse serviço?', e.q1, 'cQ1', 1);

        if (semUso) {
          var av = document.createElement('div');
          av.className = 'aviso';
          av.innerHTML =
            '<i class="fa-regular fa-circle-question"></i>' +
            '<h3>Demais questões não apresentadas</h3>' +
            '<p>Nenhum dos ' + e.respondentes + ' conselheiros que responderam a esta enquete havia utilizado o serviço. ' +
            'Pela regra de fluxo do formulário, a resposta “NÃO” à questão 1 encerra a pesquisa — por isso as questões 2 a 5 ' +
            'não foram exibidas.</p>';
          grid.appendChild(av);
        } else {
          pizzaCard('02', 'Você teve facilidade para acessar o serviço?', e.q2, 'cQ2', 2);
        }
      } else {
        barrasCard('03', 'Como foi o atendimento desse serviço?', e.q3, 'cQ3', 3);
        barrasCard('04', 'Avaliação do tempo para conclusão do pedido', e.q4, 'cQ4', 4);
      }
    })();
  </script>
  <script>
    document.addEventListener("keydown", function (e) {

      var emBotao = document.activeElement && document.activeElement.tagName === 'BUTTON';
      if (e.key === ' ' && emBotao) return;
      if (["ArrowRight", "ArrowLeft", "PageDown", "PageUp", "Home", "End", " ", "f", "F"].indexOf(e.key) !== -1) {
        e.preventDefault(); window.parent.postMessage({ type: "slide-nav", key: e.key }, "*");
      }
    });
  </script>
  <script src="a11y.js" defer></script>
</body>
